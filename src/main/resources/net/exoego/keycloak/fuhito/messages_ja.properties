import.parent_twice=親を外部 ID「{parentExternalId}」と ID「{parentId}」の両方で指定しています。どちらか一方にしてください。
import.parent_id_unknown=ID「{parentId}」の組織ユニットはありません。
org_unit.follows_others=組織「{id}」は {date} から他の組織の後継のため、その日に存在している必要があります。
csv.too_many_cells=行のセルが {cells} 個あり、見出しの {columns} 列より多くなっています。カンマを含む値は二重引用符で囲んでください。
restore.reference_unknown={list} の行が {field} で「{value}」を参照していますが、エクスポートにその行はありません。
restore.id_taken={list} の ID「{id}」は、このデータベースですでに使われています。たとえばエクスポート元のレルムです。
restore.bad_value={list} の行に、ない値、読めない値、書き込みの規則に反する値、またはエクスポートとは別の形の値があります。
restore.duplicate={list} の行「{id}」は、行「{other}」と同じ {field} を持っています。その値を持てる行は一つだけです。
restore.overlap={list} の行「{id}」と行「{other}」は同じ日に有効ですが、有効にできるのはどちらか一方だけです。{field} を確認してください。
restore.conflict=復元の行がデータベースの規則 {constraint} に反しています。別の書き込みが同時に同じ行を保存した可能性があります。何も書き込まれていません。
employment.employer_ends=雇用主「{employerId}」は {date} に終了します。そこでの雇用はそれまでに終了する必要があります。
import.id_unknown=ID「{id}」のデータは保存されていません。
import.id_mismatch=行の ID「{id}」と外部 ID「{externalId}」が、別々のデータを指しています。
csv.export_list_unknown=リスト「{list}」はありません。リストは {lists} です。
import.person_twice=人を外部 ID「{personExternalId}」と ID「{personId}」の両方で指定しています。どちらか一方にしてください。
import.employer_twice=雇用主を外部 ID「{employerExternalId}」と ID「{employerId}」の両方で指定しています。どちらか一方にしてください。
import.employment_twice=雇用を外部 ID「{employmentExternalId}」と ID「{employmentId}」の両方で指定しています。どちらか一方にしてください。
import.org_unit_twice=組織単位を外部 ID「{orgUnitExternalId}」と ID「{orgUnitId}」の両方で指定しています。どちらか一方にしてください。
import.assignment_twice=行が所属を外部ID「{assignmentExternalId}」と ID「{assignmentId}」の両方で指しています。どちらか一方にしてください。
import.assignment_unknown=外部ID「{assignmentExternalId}」の所属は、文書にも保存済みのデータにもありません。
import.manager_twice=行が上司を複数の方法で指しています。どれか一つにしてください。
import.continues_twice=行が引き継ぎ元を外部 ID と ID の両方で指しています。どちらか一方にしてください。
import.continues_mismatch=外部ID「{externalId}」の行は、保存済みとは別の引き継ぎ元を指しています。引き継ぎ元は変えられません。
employment.continues_unknown=ID「{id}」の雇用はありません。
employment.continues_other=雇用「{id}」は、同じ人の別の雇用ではありません。
employment.continues_holds=雇用「{id}」は、それを引き継ぐ雇用が始まる {date} までに終わっていません。終了日を {date} 以前にしてください。
import.user_twice=行が {field} のユーザーを ID とユーザー名の両方で指しています。どちらか一方にしてください。
import.person_ways=行が人を複数の方法で指しています。どれか一つにしてください。
import.organization_unknown=レルムに別名「{alias}」の Keycloak の Organization がありません。
import.successors_differ=組織単位「{id}」は {validTo} に別の後継で、または別の日に終了しています。後継は変えられません。
import.successor_unknown=このソースの外部ID「{successorExternalId}」の組織単位はありません。
import.value_fixed=行が指す「{id}」は、{field} が別の値で保存されています。この値は変えられません。指定しないか、保存されている値を指定してください。別のものには別の外部 ID を使ってください。
import.user_taken=ユーザー「{userId}」は、すでに人「{personId}」にリンクされています。その人の行は、ID かその人の外部 ID で指してください。
invalid.blank={field} を空や空白だけにすることはできません。値がないときは、本文では null にし、クエリではパラメーターを省いてください。
invalid.character={field} に保存できない文字 {codePoint} があります。NUL (U+0000) と、サロゲートペアの片方だけの文字は保存できません。
invalid.duplicate_key={field} のキーが一つのオブジェクトに二度あります。キーは一度だけにしてください。
invalid.unknown_key=このリクエストの本文はキー {field} を受け付けません。キーの名前と場所を確かめてください。大文字と小文字は区別されます。
invalid.unknown_parameter=このリクエストはクエリパラメーター {field} を受け付けません。名前を確かめてください。大文字と小文字は区別されます。
invalid.parameter_twice=クエリパラメーター {field} が二度あります。一度だけにしてください。
invalid.twice={field} と {otherField} は同じものを二通りで指しています。どちらか一方にしてください。
invalid.mismatch={field} と {otherField} は別々のものを指しています。どちらか一方にするか、同じものを指す値にしてください。
invalid.value_fixed=この書き込みでは {field} を変えられません。指定しないか、読み取りで得た値を指定してください。
import.end_kept=「{id}」は {validTo} に終わります。行で終わりをなくすことはできません。行で指定できるのは、より前の終わりだけです。
csv.clear_conflict=行が名称の列の #CLEAR で言語「{value}」を削除していますが、{field} にもその言語のセルがあります。どちらか一方にしてください。
employment.end_reason_without_end=終了理由「{endReason}」は validTo に終了日があるときだけ指定できます。
invalid.not_together={field} と {otherField} は同時に指定できません。どちらか一方にしてください。
csv.export_no_date=リスト「{list}」には日付がないため、{field} は指定できません。指定しないでください。
invalid.type={field} は {type} 型の値にしてください。別の型の値は変換しません。本文の "3" は数値ではなく、3.0 は整数ではありません。クエリの数値は JSON と同じ形で、0 から 9 の数字だけで書いてください。クエリの真偽値は小文字の true か false にしてください。
invalid.out_of_range={field} は {min} から {max} までの整数にしてください。
invalid.number={field} の数値 {value} は、指数が大きすぎるか小さすぎるため読めません。
change_log.cursor_expired=変更ログには、{after} より後の波及変更がすべては残っていません。すべてのリソースを読み直してから、{keptAfter} より後を読んでください。
change_log.keep_days_invalid=レルム属性「fuhito.changeLog.keepPropagatedDays」は 0 以上の日数にしてください。「{value}」は使えません。
