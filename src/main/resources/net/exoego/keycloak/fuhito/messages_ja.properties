invalid.required={field} は必須です。
invalid.code={field} は英数字、アンダースコア、ドット、ハイフンで 1 文字以上 64 文字以下とし、先頭は英数字にしてください。
invalid.name={field} は空白のみにできません。255 文字以下にしてください。
invalid.language_tag={field} の言語タグ「{value}」が正しくありません。
invalid.kind=種類「{value}」は存在しません。
ref_item.not_found=参照データ「{id}」は存在しません。
ref_item.code_taken=コード「{code}」は種類 {kind} ですでに使われています。
invalid.date={field} は YYYY-MM-DD 形式の日付にしてください。指定された値は「{value}」です。
ref_item.in_use=参照データ「{id}」は使用中です。削除せずに無効化してください。
org_unit.not_found=組織単位「{id}」は存在しません。
org_unit.not_valid_on=組織単位「{id}」は {date} の時点で存在しません。
org_unit.code_taken=コード「{code}」は別の組織単位ですでに使われています。
org_unit.unit_type_unknown=組織種別「{unitType}」は存在しないか、無効です。
org_unit.parent_unknown=親の組織単位「{parentId}」は存在しません。
org_unit.parent_not_valid=親の組織単位「{parentId}」は {validFrom} 以降の全期間では存在しません。
org_unit.cycle=この移動を行うと、組織単位「{id}」が自分自身の配下になります。
org_unit.already_ended=組織単位「{id}」はすでに {validTo} で終了しています。
org_unit.later_changes_exist=組織単位「{id}」には {validTo} 以降の変更があります。
org_unit.has_children=組織単位「{id}」には {validTo} 以降も {count} 件の子の組織単位があります。先に移動するか終了してください。
invalid.period=終了日 {validTo} は開始日 {validFrom} より後にしてください。
invalid.percent={field} は 0 より大きく 100 以下で、小数点以下 2 桁までにしてください。指定された値は {value} です。
invalid.choice={field} の値「{value}」は使えません。
ref_item.unknown=種類 {kind} の参照データ「{code}」は存在しないか、無効です。
employment.not_found=雇用「{id}」は存在しません。
employment.user_unknown=ユーザー「{userId}」は存在しません。
employment.staff_number_taken=職員番号「{staffNumber}」は別のユーザーですでに使われています。
employment.not_valid_on=雇用「{id}」は {date} の時点で存在しません。
