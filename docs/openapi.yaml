        name: after
        in: query
        schema:
          type: string
      - description: The date to read. The default is today in the time zone of the
          realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: The code of the unit on the date.
        name: code
        in: query
        schema:
          type: string
      - description: The number of entries to skip. It cannot be used with `after`.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The code of the hierarchy of the parents and of `roots`. The
          default is the hierarchy `default`.
        name: hierarchy
        in: query
        schema:
          type: string
      - description: "True for lateral units only, such as committees. False for line\
          \ units only. Leave it out for both."
        name: lateral
        in: query
        schema:
          type: boolean
      - description: "True for the units that are legal entities only, such as companies.\
          \ False for the other units only. Leave it out for both. A unit is one when\
          \ its unit type says so."
        name: legalEntity
        in: query
        schema:
          type: boolean
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: "A part of the name, of the short name, or of the phonetic name,\
          \ in any language, with no regard to case."
        name: q
        in: query
        schema:
          type: string
      - description: "True for rollup units only, such as regions. False for the other\
          \ units only. Leave it out for both."
        name: rollup
        in: query
        schema:
          type: boolean
      - description: "True for the units with no parent in `hierarchy` only, the roots.\
          \ A rollup unit is not in the default hierarchy, so it is no root there.\
          \ In a hierarchy other than the default one, a root also has a child in\
          \ it."
        schema:
          type: boolean
          default: false
        name: roots
        in: query
      - description: The code of the unit type.
        name: unitType
        in: query
        schema:
          type: string
