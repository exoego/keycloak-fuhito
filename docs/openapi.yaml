  /imports/csv/{list}:
    get:
      summary: Returns a list on a date as a CSV that the import loads again.
      description: "The lists are the same as for the import. A row of a thing that\
        \ has an ID has the column `id`, so that a row of a thing with no external\
        \ ID comes back too. The columns `source` and `externalId` hold the system\
        \ that made the thing and the ID that it has there. A thing that keeps no\
        \ system that made it, such as a reporting line, has the first of its IDs\
        \ by the name of the system. The kinds, the definitions of attributes, the\
        \ hierarchies, and the people have no date. The reference items have the names\
        \ of the date."
      operationId: exportCsv
      tags:
      - bulk
      parameters:
      - description: The kind of rows.
        schema:
          type: string
          enum:
          - ref-kinds
          - attribute-definitions
          - ref-items
          - hierarchies
          - org-units
          - org-unit-parents
          - people
          - employments
          - assignments
          - reporting-lines
          - unit-roles
          - qualifications
          - external-ids
          - change-orders
        name: list
        in: path
        required: true
      - description: The date of the state. The default is today in the time zone
          of the realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: '`ja` for the Japanese names of the columns. The default is the
          English ones.'
        schema:
          type: string
          enum:
          - en
          - ja
        name: header
        in: query
      responses:
        "200":
          description: "The CSV, in UTF-8 with a byte order mark."
          content:
            text/csv: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      summary: Loads one CSV file in one transaction.
      description: "The first row has the column names, in English or in Japanese.\
        \ A blank cell keeps the stored value. The cell `#CLEAR` removes it. The `charset`\
        \ of the content type says how the file is encoded. The default is UTF-8."
      operationId: applyCsvImport
      tags:
      - bulk
      parameters:
      - description: The kind of rows.
        schema:
          type: string
          enum:
          - ref-kinds
          - attribute-definitions
          - ref-items
          - hierarchies
          - org-units
          - org-unit-parents
          - people
          - employments
          - assignments
          - reporting-lines
          - unit-roles
          - qualifications
          - external-ids
          - change-orders
        name: list
        in: path
        required: true
      - description: True to do all checks and write nothing.
        schema:
          type: boolean
          default: false
        name: dryRun
        in: query
      - description: The date of the state.
        required: true
        schema:
          type: string
          format: date
        name: effectiveDate
        in: query
      - description: The name of the system that the rows come from.
        schema:
          type: string
          default: import
        name: source
        in: query
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          text/csv:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: "The rows were written, or the request was a dry run without\
            \ errors."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/ImportFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /org-units:
    get:
      summary: "Lists the org units of a date that match the filters, at any depth."
      description: "With no filter, the list has every org unit of the date. The filters\
        \ apply together. Each unit comes with its parent in `hierarchy`. The order\
        \ is the display order, then the phonetic name and the name of the primary\
        \ language. To read every unit, follow the `Link` header of each response.\
