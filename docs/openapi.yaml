---
tags:
- name: general
  summary: General
  kind: nav
  description: The version and the hierarchies.
- name: ref-items
  summary: Reference items
  kind: nav
  description: "The lists that a realm defines, such as unit types and occupations,\
    \ and the definitions of free attributes."
- name: org-units
  summary: Org units
  kind: nav
  description: "Org units, their tree on a date, and their history."
- name: employments
  summary: Employments
  kind: nav
  description: "Employments of users, with their terms over time."
- name: assignments
  summary: Assignments
  kind: nav
  description: Assignments of employments to org units.
- name: reporting-lines
  summary: Reporting lines
  kind: nav
  description: Links from an assignment to a manager.
- name: unit-roles
  summary: Roles over org units
  kind: nav
  description: Roles of employments over org units that are not membership.
- name: qualifications
  summary: Qualifications
  kind: nav
  description: Licenses and certificates of users.
- name: people
  summary: People
  kind: nav
  description: "The people that the realm knows, with or without a Keycloak user."
- name: users
  summary: Users
  kind: nav
  description: What is stored about one user.
- name: change-orders
  summary: Change orders and change log
  kind: nav
  description: "Approved instructions that cause changes, and the log of every write."
- name: bulk
  summary: Import
  kind: nav
  description: Many rows in one request.
- name: keycloak
  summary: Keycloak sync
  kind: nav
  description: "The projection into organization groups, and the sync from user attributes."
openapi: 3.2.0
components:
  schemas:
    Assignment:
      required:
      - employmentId
      - orgUnitId
      - validFrom
      description: A request to add an assignment gives the first details in the fields
        of the assignment itself. A response gives the details of every period in
        `periods`.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the assignment. A new assignment has 1. Each\
            \ write counts it up by one, also a change of a period or of an ID of\
            \ another system."
          readOnly: true
        employmentId:
          type: string
        userId:
          type: string
          description: The ID of the Keycloak user of the employment.
          readOnly: true
        orgUnitId:
          type: string
        validFrom:
          type: string
          description: The first date of the assignment.
          format: date
        validTo:
          type: string
          description: The first date after the assignment. It is missing for no end.
          format: date
        externalId:
          type: string
          maxLength: 255
          description: "The ID of the assignment in the system that `source` names.\
            \ A write stores it as the ID of that system, in place of the one that\
            \ the system had. A read gives every ID in `externalIds`."
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "The name of the system that made the assignment. A create\
            \ sets it, and it never changes. With `externalId`, it names the system\
            \ of that ID."
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the assignment. The one of\
            \ `source` comes first, then the others by system."
          readOnly: true
        continuesAssignmentId:
          type: string
          description: "The ID of the assignment that this one continues, after a\
            \ move to another org unit or a transfer to another employer."
          readOnly: true
        jobTitle:
          type: string
          description: The code of the first job title.
          writeOnly: true
        occupation:
          type: string
          description: The code of the first occupation.
          writeOnly: true
        kind:
          type: string
          description: The code of the first assignment kind.
          writeOnly: true
        workLocation:
          type: string
          description: The code of the first work location. Leave it out to take the
            one of the org unit.
          writeOnly: true
        costCenter:
          type: string
          description: The code of the first cost center. Leave it out to take the
            one of the org unit.
          writeOnly: true
        head:
          type: boolean
          description: Whether the person leads the org unit at first.
          writeOnly: true
        primary:
          type: boolean
          description: Whether this is the main assignment at first.
          writeOnly: true
        switchPrimary:
          type: boolean
          description: True to take the primary flag away from other assignments of
            the employment for the same dates.
          writeOnly: true
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The first share of the person's work in percent.
          writeOnly: true
        displayOrder:
          type: integer
          format: int32
          description: The first position among the members of the org unit.
          writeOnly: true
        attributes:
          type: object
          additionalProperties: {}
          description: The first free values.
          writeOnly: true
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentDetails"
          description: "The details of each period, oldest first."
          readOnly: true
    AssignmentDetails:
      type: object
      required:
      - version
      - validFrom
      description: The details of an assignment for a period.
      properties:
        version:
          type: integer
          format: int64
          description: The version of the assignment that the caller read.
          writeOnly: true
        validFrom:
          type: string
          description: The first date of these details.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
          readOnly: true
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        workLocation:
          type: string
          description: The code of the work location of the assignment itself. Leave
            it out to take the one of the org unit.
        costCenter:
          type: string
          description: The code of the cost center of the assignment itself. Leave
            it out to take the one of the org unit.
        effectiveWorkLocation:
          type: string
          description: "The code of the work location that applies. It is the one\
            \ of the assignment, else the one of the org unit, else the one of the\
            \ nearest unit above it in the default hierarchy. It is read on the date\
            \ of the period nearest to today."
          readOnly: true
        effectiveCostCenter:
          type: string
          description: "The code of the cost center that applies. It is the one of\
            \ the assignment, else the one of the org unit, else the one of the nearest\
            \ unit above it in the default hierarchy. It is read on the date of the\
            \ period nearest to today."
          readOnly: true
        head:
          type: boolean
          description: True when the person leads the org unit.
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
        switchPrimary:
          type: boolean
          description: True to take the primary flag away from other assignments of
            the employment for the same dates.
          writeOnly: true
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: "The position among the members of the org unit, lowest first."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    AttributeDefinition:
      required:
      - target
      - name
      - type
      description: The definition of one free attribute of one kind of resource.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the definition. A new definition has 1. Each\
            \ write counts it up by one, also a change of an ID of another system.\
            \ A write of a stored definition sends the version that the caller read.\
            \ A create needs none."
        target:
          type: string
          description: The kind of resource. Only a create request reads it.
          enum:
          - ORG_UNIT
          - PERSON
          - EMPLOYMENT_TERMS
          - ASSIGNMENT
          - QUALIFICATION
          - REF_ITEM
        name:
          type: string
          maxLength: 64
          description: The name in `attributes`. Only a create request reads it.
        type:
          type: string
          enum:
          - STRING
          - NUMBER
          - BOOLEAN
          - DATE
          - REF_ITEM
        refKind:
          type: string
          description: "The kind of reference data, fixed or of the realm. Only the\
            \ type `REF_ITEM` has it."
        multiple:
          type: boolean
          description: "True when the value is a JSON array, and each element has\
            \ the type."
          default: false
        required:
          type: boolean
          description: True when every write of the resource must give a value. A
            list needs at least one element.
          default: false
        externalId:
          type: string
          maxLength: 255
          description: The ID of the definition in the system that `source` names.
            Only a create reads it. A read gives every ID in `externalIds`.
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system of `externalId`. Only a create reads
            it.
          writeOnly: true
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the definition, by system."
          readOnly: true
    ChangeLogEntry:
      required:
      - id
      - sequence
      - recordedAt
      - actorUserId
      - resourceType
      - resourceId
      - operation
      - resourcePath
      description: One successful write. It has no state of the resource. Read the
        resource again for its state.
      type: object
      properties:
        id:
          type: string
        sequence:
          type: integer
          format: int64
          description: "The position of the entry in the change log of the realm,\
            \ counted from 1."
        recordedAt:
          type: string
          description: "When the write happened, in UTC."
          format: date-time
        actorUserId:
          type: string
          description: The ID of the user who did the write.
        resourceType:
          type: string
          examples:
          - FUHITO_ORG_UNIT
        resourceId:
          type: string
        operation:
          type: string
          enum:
          - CREATE
          - UPDATE
          - DELETE
        resourcePath:
          type: string
          description: The path of the request below the realm.
          examples:
          - fuhito/org-units/123/end
        changeOrderId:
          type: string
          description: The ID of the change order that the write belongs to.
    ChangeOrder:
      required:
      - title
      - effectiveDate
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the order. A new order has 1. Each write counts\
            \ it up by one, also a change of an ID of another system. A write of a\
            \ stored order sends the version that the caller read. A create needs\
            \ none."
        number:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the order.
        kind:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code for the kind of order that the realm chooses.
        title:
          type: string
          maxLength: 255
        note:
          type: string
          description: A longer text.
        orderDate:
          type: string
          description: The date when the order was issued.
          format: date
        effectiveDate:
          type: string
          description: The date from which the changes are true.
          format: date
        approverUserId:
          type: string
          description: The ID of the Keycloak user who approved the order.
        requesterUserId:
          type: string
          description: The ID of the Keycloak user who asked for the order.
        externalReference:
          type: string
          description: A reference to the order in another system.
        createdAt:
          type: string
          description: "When the order was stored, in UTC."
          format: date-time
          readOnly: true
        announcedAt:
          type: string
          description: "When the order was announced, in UTC. It is absent until someone\
            \ records the announcement. The extension hides nothing with it. An application\
            \ can hide the planned changes of an order that has none."
          format: date-time
          readOnly: true
        announcedByUserId:
          type: string
          description: The ID of the Keycloak user who recorded the announcement.
          readOnly: true
        externalId:
          type: string
          maxLength: 255
          description: The ID of the order in the system that `source` names. Only
            a create reads it. A read gives every ID in `externalIds`.
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system of `externalId`. Only a create reads
            it.
          writeOnly: true
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the order, by system."
          readOnly: true
    Count:
      required:
      - count
      description: The number of entries that a list has on all its pages with the
        same filters.
      type: object
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
          description: The number of entries.
    EffectiveChange:
      required:
      - effectiveDate
      - resourceType
      - resourceId
      - resourcePath
      description: "The fact that something about a resource starts, changes, or ends\
        \ on a date."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date that a period of the resource starts or ends on.
          format: date
        resourceType:
          type: string
          enum:
          - FUHITO_ORG_UNIT
          - FUHITO_EMPLOYMENT
          - FUHITO_ASSIGNMENT
          - FUHITO_REPORTING_LINE
          - FUHITO_QUALIFICATION
          - FUHITO_UNIT_ROLE
        resourceId:
          type: string
        resourcePath:
          type: string
          description: The path of the resource below the realm.
          examples:
          - fuhito/org-units/123
    Employment:
      required:
      - validFrom
      description: A request to start an employment gives the first terms in the fields
        of the employment itself. It names the person by `personId` or by `userId`.
        A response gives the terms of every period in `terms`.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the employment. A new employment has 1. Each\
            \ write counts it up by one, also a change of the terms or of an ID of\
            \ another system."
          readOnly: true
        personId:
          type: string
          description: The ID of the person.
        userId:
          type: string
          description: "The ID of the Keycloak user that the person is linked to.\
            \ A request can give it in place of `personId`. The person of the user\
            \ is then used, and created when the user has none."
        employerId:
          type: string
          description: "The ID of the org unit that employs the person. It is a legal\
            \ entity on the first date of the employment, and it never changes. A\
            \ request can leave it out when the realm has exactly one legal entity\
            \ on that date."
        validFrom:
          type: string
          description: The first date of the employment.
          format: date
        validTo:
          type: string
          description: The first date after the employment. It is missing for no end.
          format: date
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person.
        endReason:
          type: string
          description: The code of the end reason.
          readOnly: true
        externalId:
          type: string
          maxLength: 255
          description: "The ID of the employment in the system that `source` names.\
            \ A write stores it as the ID of that system, in place of the one that\
            \ the system had. A read gives every ID in `externalIds`."
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "The name of the system that made the employment. A create\
            \ sets it, and it never changes. With `externalId`, it names the system\
            \ of that ID."
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the employment. The one of\
            \ `source` comes first, then the others by system."
          readOnly: true
        continuesEmploymentId:
          type: string
          description: The ID of the employment that this one continues after a transfer
            to another employer.
          readOnly: true
        employmentType:
          type: string
          description: The code of the first employment type.
          writeOnly: true
        grade:
          type: string
          description: The code of the first grade.
          writeOnly: true
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          description: The first status.
          writeOnly: true
          default: ACTIVE
        leaveReason:
          type: string
          description: The code of the first leave reason.
          writeOnly: true
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The first share of full-time work in percent.
          writeOnly: true
        contractEndDate:
          type: string
          description: The last day of the first fixed-term contract. Leave it out
            for an indefinite contract.
          format: date
          writeOnly: true
        attributes:
          type: object
          additionalProperties: {}
          description: The first free values.
          writeOnly: true
        terms:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentTerms"
          description: "The terms of each period, oldest first."
          readOnly: true
    EmploymentStatus:
      type: string
      enum:
      - ACTIVE
      - ON_LEAVE
      - SUSPENDED
      description: Whether a person works during a period of an employment.
    EmploymentTerms:
      type: object
      required:
      - version
      - validFrom
      description: The conditions of an employment for a period.
      properties:
        version:
          type: integer
          format: int64
          description: The version of the employment that the caller read.
          writeOnly: true
        validFrom:
          type: string
          description: The first date of these conditions.
          format: date
        validTo:
          type: string
          description: The first date after these conditions. It is missing for no
            end.
          format: date
          readOnly: true
        employmentType:
          type: string
          description: The code of the employment type.
        grade:
          type: string
          description: The code of the grade.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          default: ACTIVE
        leaveReason:
          type: string
          description: The code of the leave reason. Only the status `ON_LEAVE` may
            have one.
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
        contractEndDate:
          type: string
          description: The last day of the fixed-term contract in force. It is missing
            for an indefinite contract. A renewal is new terms with a later date.
            It does not end the employment.
          format: date
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    End:
      required:
      - version
      - validTo
      description: A request to end something on a date.
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the resource that the caller read.
        validTo:
          type: string
          description: The first date on which it no longer exists.
          format: date
        endReason:
          type: string
          description: The code of the end reason. Only the end of an employment uses
            it.
    Error:
      required:
      - error
      - message
      type: object
      properties:
        error:
          type: string
          description: The stable error code.
        params:
          type: object
          additionalProperties:
            type: string
          description: The values that the message refers to.
        message:
          type: string
          description: The message for people. Its text can change. Its language follows
            the `Accept-Language` header.
    ExportAssignment:
      type: object
      description: An assignment with the rows of every period.
      properties:
        assignmentId:
          type: string
        version:
          type: integer
          format: int64
        periods:
          type: array
          items:
            $ref: "#/components/schemas/ExportAssignmentPeriod"
    ExportAssignmentPeriod:
      type: object
      properties:
        rowId:
          type: string
        employmentId:
          type: string
        orgUnitId:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
        jobTitleId:
          type: string
        occupationId:
          type: string
        kindId:
          type: string
        workLocationId:
          type: string
        costCenterId:
          type: string
        head:
          type: boolean
        primary:
          type: boolean
        allocationPercent:
          type: number
        displayOrder:
          type: integer
          format: int32
        attributes:
          type: object
          additionalProperties: {}
        source:
          type: string
        continuesAssignmentId:
          type: string
    ExportAttributeDefinition:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        target:
          type: string
        name:
          type: string
        type:
          type: string
        refKind:
          type: string
        multiple:
          type: boolean
        required:
          type: boolean
    ExportChangeOrder:
      type: object
      description: A change order. It names its users by username.
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        number:
          type: string
        kind:
          type: string
        title:
          type: string
        note:
          type: string
        orderDate:
          type: string
        effectiveDate:
          type: string
        approver:
          type: string
        requester:
          type: string
        externalReference:
          type: string
        createdAt:
          type: string
        announcedAt:
          type: string
        announcedBy:
          type: string
    ExportEmployment:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        personId:
          type: string
        employerId:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
        staffNumber:
          type: string
        endReasonId:
          type: string
        source:
          type: string
        continuesEmploymentId:
          type: string
        terms:
          type: array
          items:
            $ref: "#/components/schemas/ExportEmploymentTerms"
    ExportEmploymentTerms:
      type: object
      properties:
        id:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
        employmentTypeId:
          type: string
        gradeId:
          type: string
        status:
          type: string
        leaveReasonId:
          type: string
        workPercent:
          type: number
        contractEndDate:
          type: string
        attributes:
          type: object
          additionalProperties: {}
    ExportErasure:
      type: object
      description: "A person whose data was erased. A restore erases the person again,\
        \ also when an older export has the data."
      properties:
        personId:
          type: string
        erasedAt:
          type: string
    ExportExternalId:
      type: object
      description: The ID that one system has for a resource. A resource names only
        the system that made it in `source`. Its IDs are all here.
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        resourceType:
          type: string
        resourceId:
          type: string
        source:
          type: string
        externalId:
          type: string
    ExportHierarchy:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
    ExportOrgUnit:
      type: object
      description: "An org unit. It names its Keycloak organization by alias, because\
        \ the IDs of organizations differ between servers."
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        source:
          type: string
        timeZone:
          type: string
        dayStart:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ExportOrgUnitVersion"
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ExportOrgUnitParent"
        successors:
          type: array
          items:
            $ref: "#/components/schemas/ExportOrgUnitSuccession"
        organizationAlias:
          type: string
          description: The alias of the Keycloak organization that the unit is linked
            to.
    ExportOrgUnitParent:
      type: object
      description: A parent link. It names its hierarchy by code.
      properties:
        id:
          type: string
        hierarchy:
          type: string
        parentId:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
    ExportOrgUnitSuccession:
      type: object
      properties:
        id:
          type: string
        successorId:
          type: string
        effectiveDate:
          type: string
    ExportOrgUnitVersion:
      type: object
      properties:
        id:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
        code:
          type: string
        primaryLanguage:
          type: string
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/OrgUnitName"
        unitTypeId:
          type: string
        workLocationId:
          type: string
        costCenterId:
          type: string
        displayOrder:
          type: integer
          format: int32
        attributes:
          type: object
          additionalProperties: {}
    ExportPerson:
      type: object
      description: A person. It names its Keycloak user by username.
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        username:
          type: string
        primaryLanguage:
          type: string
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PersonName"
        attributes:
          type: object
          additionalProperties: {}
        source:
          type: string
        maskedAt:
          type: string
          description: "The time of the mask, for a person who was masked."
    ExportQualification:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        personId:
          type: string
        kindId:
          type: string
        number:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
        attributes:
          type: object
          additionalProperties: {}
        source:
          type: string
    ExportRefItem:
      type: object
      description: A reference item with every period of its names.
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        kind:
          type: string
        code:
          type: string
        displayOrder:
          type: integer
          format: int32
        attributes:
          type: object
          additionalProperties: {}
        active:
          type: boolean
        legalEntity:
          type: boolean
        actingHead:
          type: boolean
        lateral:
          type: boolean
        rollup:
          type: boolean
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ExportRefItemNames"
          description: "The names of each period, oldest first."
    ExportRefItemNames:
      type: object
      description: The names of a reference item for a period. A missing `validFrom`
        means that they hold from the start.
      properties:
        id:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
        primaryLanguage:
          type: string
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RefItemName"
    ExportRefKind:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        code:
          type: string
        primaryLanguage:
          type: string
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RefKindName"
    ExportReportingLine:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        assignmentId:
          type: string
        managerPersonId:
          type: string
        kind:
          type: string
        validFrom:
          type: string
        validTo:
          type: string
    ExportUnitRole:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        employmentId:
          type: string
        orgUnitId:
          type: string
        roleId:
          type: string
        includesDescendants:
          type: boolean
        validFrom:
          type: string
        validTo:
          type: string
    ExternalId:
      required:
      - resourceType
      - resourceId
      - source
      - externalId
      description: The ID that one system has for one resource.
      type: object
      properties:
        resourceType:
          type: string
          enum:
          - ORG_UNIT
          - PERSON
          - EMPLOYMENT
          - ASSIGNMENT
          - QUALIFICATION
          - REPORTING_LINE
          - UNIT_ROLE
          - CHANGE_ORDER
          - REF_ITEM
          - REF_KIND
          - HIERARCHY
          - ATTRIBUTE_DEFINITION
        resourceId:
          type: string
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system.
        externalId:
          type: string
          maxLength: 255
          description: The ID in that system.
        own:
          type: boolean
          description: "True when the system made the resource, as the `source` of\
            \ the resource says."
          readOnly: true
        version:
          type: integer
          format: int64
          description: The version of this ID. A new one has 1. Each write counts
            it up by one. A write of an ID also counts up the version of its resource.
            A write of a stored ID sends the version that the caller read. A new ID
            needs none.
    ExternalIdPair:
      type: object
      required:
      - source
      - externalId
      description: The ID that one system has for a record.
      properties:
        source:
          type: string
          description: The name of the system.
        externalId:
          type: string
          description: The ID in that system.
    Hierarchy:
      required:
      - code
      - name
      description: A named tree of org units.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the hierarchy. A new hierarchy has 1. Each\
            \ write counts it up by one, also a change of an ID of another system.\
            \ A write of a stored hierarchy sends the version that the caller read.\
            \ A create needs none."
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The code. It is unique in the realm and never changes. Every
            realm has the hierarchy `default`.
        name:
          type: string
          maxLength: 255
        externalId:
          type: string
          maxLength: 255
          description: The ID of the hierarchy in the system that `source` names.
            Only a create reads it. A read gives every ID in `externalIds`.
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system of `externalId`. Only a create reads
            it.
          writeOnly: true
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the hierarchy, by system."
          readOnly: true
    ImportAssignmentRow:
      type: object
      description: "An assignment. It is matched by its ID in the system of `source`,\
        \ whichever system made it, or by `id`. A row needs one of them. A new assignment\
        \ names its employment and its org unit."
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the assignment in that system.
        employmentExternalId:
          type: string
          description: The external ID of the employment with the same source. A row
            of a stored assignment that names no employment keeps the one that is
            stored.
        orgUnitExternalId:
          type: string
          description: The external ID of the org unit with the same source. A row
            of a stored assignment that names no org unit keeps the one that is stored.
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        head:
          type: boolean
          description: True when the person leads the org unit.
          default: false
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
          default: false
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: The position among the members of the org unit.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        validFrom:
          type: string
          description: "The first date of a new assignment. The default is the effective\
            \ date. A row of a stored assignment can leave it out or give the start\
            \ of the whole assignment, not of its details. Another date fails."
          format: date
        validTo:
          type: string
          description: The first date on which the assignment no longer holds. The
            default is the end of the employment.
          format: date
        employmentId:
          type: string
          description: "The ID of the employment, for an employment with no external\
            \ ID of the same source. Give this or `employmentExternalId`, not both."
        orgUnitId:
          type: string
          description: "The ID of the org unit, for an org unit with no external ID\
            \ of the same source. Give this or `orgUnitExternalId`, not both."
        id:
          type: string
          description: "The ID of a stored assignment, for a row of an assignment\
            \ with no external ID. A CSV export has it in every row. A new assignment\
            \ has none."
        continuesAssignmentExternalId:
          type: string
          description: "The external ID of the assignment that this one continues\
            \ after a transfer between employers, with the same source. A new assignment\
            \ gets the link. A stored one must have the same. The one it continues\
            \ must end by the start of this one."
        continuesAssignmentId:
          type: string
          description: "The ID of the assignment that this one continues. Give this\
            \ or `continuesAssignmentExternalId`, not both."
        workLocation:
          type: string
          description: "The code of the work location. With none, the one of the org\
            \ unit applies."
        costCenter:
          type: string
          description: "The code of the cost center. With none, the one of the org\
            \ unit applies."
    ImportAttributeDefinitionRow:
      type: object
      required:
      - type
      description: "The definition of a free attribute. It is matched by its ID in\
        \ the system of `source`, or by `id`. A row needs one of them. A row of a\
        \ stored definition changes the type, the kind, whether the value is a list,\
        \ and whether a value is required. The target and the name do not change."
      properties:
        id:
          type: string
          description: The ID of a stored definition. A CSV export has it in every
            row. A new definition has none.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the definition in that system.
        target:
          type: string
          description: The kind of resource. A row of a stored definition may leave
            it out.
          enum:
          - ORG_UNIT
          - PERSON
          - EMPLOYMENT_TERMS
          - ASSIGNMENT
          - QUALIFICATION
          - REF_ITEM
        name:
          type: string
          maxLength: 64
          description: "The name in `attributes`, which no other definition of the\
            \ target has. A row of a stored definition may leave it out."
        type:
          type: string
          enum:
          - STRING
          - NUMBER
          - BOOLEAN
          - DATE
          - REF_ITEM
        refKind:
          type: string
          description: The kind of reference data. Only the type `REF_ITEM` has it.
        multiple:
          type: boolean
          description: "True when the value is a JSON array, and each element has\
            \ the type."
          default: false
        required:
          type: boolean
          description: True when every write of the resource must give a value.
          default: false
    ImportChangeOrderRow:
      type: object
      required:
      - title
      description: "A change order. It is matched by its ID in the system of `source`,\
        \ or by `id`. A row needs one of them. A row of a stored order replaces its\
        \ values, as `PUT` does. The announcement is not part of a row."
      properties:
        id:
          type: string
          description: The ID of a stored order. A CSV export has it in every row.
            A new order has none.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the order in that system.
        number:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A number that no other order has.
        kind:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
        title:
          type: string
          maxLength: 255
        note:
          type: string
        orderDate:
          type: string
          format: date
        effectiveDate:
          type: string
          description: A new order without it takes the effective date of the import.
            A stored order without it keeps its date.
          format: date
        approverUserId:
          type: string
          description: The ID of the Keycloak user who approved it. Give this or `approverUsername`.
        approverUsername:
          type: string
          description: The username of the user who approved it.
        requesterUserId:
          type: string
          description: The ID of the Keycloak user who asked for it. Give this or
            `requesterUsername`.
        requesterUsername:
          type: string
          description: The username of the user who asked for it.
        externalReference:
          type: string
          description: "A reference in another system, such as a workflow."
    ImportCounts:
      type: object
      required:
      - created
      - changed
      - unchanged
      description: The number of rows of one list by outcome.
      properties:
        created:
          type: integer
          format: int32
          description: Rows that made a new thing.
        changed:
          type: integer
          format: int32
          description: Rows that changed an existing thing.
        unchanged:
          type: integer
          format: int32
          description: Rows that matched what was stored.
    ImportDocument:
      required:
      - effectiveDate
      description: "The data of one import. The document describes the state from\
        \ the effective date. A new thing starts on that date, and a change to an\
        \ existing thing takes effect on that date."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date of the state.
          format: date
        dryRun:
          type: boolean
          description: True to do all checks and write nothing.
          default: false
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "The name of the system that the rows come from. Rows can override\
            \ it. A row matches a stored record that has the ID of the row in that\
            \ system, whichever system made the record. A new org unit, person, employment,\
            \ assignment, or qualification keeps it as the system that made it."
          default: import
        refItems:
          type: array
          items:
            $ref: "#/components/schemas/ImportRefItemRow"
        orgUnits:
          type: array
          items:
            $ref: "#/components/schemas/ImportOrgUnitRow"
        employments:
          type: array
          items:
            $ref: "#/components/schemas/ImportEmploymentRow"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ImportAssignmentRow"
        people:
          type: array
          items:
            $ref: "#/components/schemas/ImportPersonRow"
          description: "The people. They come before the employments, which can name\
            \ them."
        refKinds:
          type: array
          items:
            $ref: "#/components/schemas/ImportRefKindRow"
          description: "The kinds of reference data that the realm adds. They come\
            \ first, so that the reference items can name them."
        attributeDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ImportAttributeDefinitionRow"
          description: "The definitions of free attributes. They come after the kinds\
            \ and before the reference items, whose attributes they check."
        hierarchies:
          type: array
          items:
            $ref: "#/components/schemas/ImportHierarchyRow"
          description: The hierarchies. They come before the org units.
        orgUnitParents:
          type: array
          items:
            $ref: "#/components/schemas/ImportOrgUnitParentRow"
          description: The parents of org units in hierarchies. They come after the
            org units.
        reportingLines:
          type: array
          items:
            $ref: "#/components/schemas/ImportReportingLineRow"
          description: The reporting lines. They come after the assignments.
        unitRoles:
          type: array
          items:
            $ref: "#/components/schemas/ImportUnitRoleRow"
          description: The roles over org units. They come after the employments.
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/ImportQualificationRow"
          description: The qualifications. They come after the people.
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ImportExternalIdRow"
          description: The IDs of other systems. They come after every list of resources.
        changeOrders:
          type: array
          items:
            $ref: "#/components/schemas/ImportChangeOrderRow"
          description: The change orders. They come first.
    ImportEmploymentRow:
      type: object
      description: "An employment. It is matched by its ID in the system of `source`,\
        \ whichever system made it, or by `id`. A row needs one of them."
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the employment in that system.
        username:
          type: string
          description: "The username of the Keycloak user. A row needs this, `userId`,\
            \ or `personExternalId`, except for a stored employment."
        userId:
          type: string
          description: The ID of the Keycloak user.
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person. It is
            used only when the employment is created.
        employmentType:
          type: string
          description: The code of the employment type.
        grade:
          type: string
          description: The code of the grade.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          default: ACTIVE
        leaveReason:
          type: string
          description: The code of the leave reason. Only the status `ON_LEAVE` may
            have one.
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
        contractEndDate:
          type: string
          description: The last day of the fixed-term contract. Leave it out for an
            indefinite contract.
          format: date
        attributes:
          type: object
          additionalProperties: {}
          description: Free values of the terms.
        validFrom:
          type: string
          description: "The first date of a new employment. The default is the effective\
            \ date. A row of a stored employment can leave it out or give the start\
            \ of the employment, not of its terms. Another date fails."
          format: date
        validTo:
          type: string
          description: The first date on which the employment no longer holds.
          format: date
        endReason:
          type: string
          description: The code of the end reason. It is used only with `validTo`.
        employerExternalId:
          type: string
          description: "The external ID of the org unit that employs the person. It\
            \ is a legal entity. Leave it out when the realm has exactly one. A stored\
            \ employment keeps its employer, so the value must name that one."
        personExternalId:
          type: string
          description: "The external ID of the person with the same source, for a\
            \ person from the list of people. It names a person with no Keycloak user\
            \ too."
        personId:
          type: string
          description: "The ID of the person, for a person with no external ID of\
            \ the same source. Give this or `personExternalId`, not both."
        employerId:
          type: string
          description: "The ID of the employer, for an employer with no external ID\
            \ of the same source. Give this or `employerExternalId`, not both."
        id:
          type: string
          description: "The ID of a stored employment, for a row of an employment\
            \ with no external ID. A CSV export has it in every row. A new employment\
            \ has none."
        continuesEmploymentExternalId:
          type: string
          description: "The external ID of the employment that this one continues\
            \ after a transfer between employers, with the same source. A new employment\
            \ gets the link. A stored one must have the same. The one it continues\
            \ must end by the start of this one."
        continuesEmploymentId:
          type: string
          description: "The ID of the employment that this one continues. Give this\
            \ or `continuesEmploymentExternalId`, not both."
    ImportExternalIdRow:
      type: object
      required:
      - resourceType
      - resourceId
      - externalId
      description: "The ID that a system has for a resource. It is matched by type\
        \ of resource, resource, and source. Another external ID replaces the stored\
        \ one, and an empty text removes it. The resource keeps the name of the system\
        \ that made it."
      properties:
        resourceType:
          type: string
          enum:
          - ORG_UNIT
          - PERSON
          - EMPLOYMENT
          - ASSIGNMENT
          - QUALIFICATION
          - REPORTING_LINE
          - UNIT_ROLE
          - CHANGE_ORDER
          - REF_ITEM
          - REF_KIND
          - HIERARCHY
          - ATTRIBUTE_DEFINITION
        resourceId:
          type: string
          description: The ID of the resource.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system. The default is the source of the document.
        externalId:
          type: string
          description: "The ID in that system, or an empty text to remove the stored\
            \ one."
    ImportHierarchyRow:
      type: object
      required:
      - name
      description: "A hierarchy. It is matched by its ID in the system of `source`,\
        \ or by `id`. A row needs one of them. A row of a stored hierarchy changes\
        \ its name. The code does not change."
      properties:
        id:
          type: string
          description: The ID of a stored hierarchy. A CSV export has it in every
            row. A new hierarchy has none.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the hierarchy in that system.
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that no other hierarchy has. A row of a stored hierarchy
            may leave it out.
        name:
          type: string
          maxLength: 255
    ImportOrgUnitParentRow:
      type: object
      required:
      - hierarchy
      description: The parent of an org unit in a hierarchy from the effective date.
        It is matched by hierarchy and org unit. A row with no parent takes the unit
        out of the hierarchy.
      properties:
        hierarchy:
          type: string
          description: The code of the hierarchy.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the external IDs come from. The
            default is the source of the document.
        orgUnitExternalId:
          type: string
          description: The external ID of the org unit. Give this or `orgUnitId`.
        orgUnitId:
          type: string
          description: The ID of the org unit.
        parentExternalId:
          type: string
          description: "The external ID of the parent. Give this or `parentId`, or\
            \ none for no parent."
        parentId:
          type: string
          description: The ID of the parent.
    ImportOrgUnitRow:
      type: object
      required:
      - primaryLanguage
      - names
      description: "An org unit. It is matched by its ID in the system of `source`,\
        \ whichever system made it, or by `id`. A row needs one of them."
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the unit in that system.
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that no other org unit has on the same date. A row for
            a stored unit changes it from the effective date.
        primaryLanguage:
          type: string
          description: "The language tag of the primary names, such as `ja`. It is\
            \ a key of `names`."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/OrgUnitName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`."
        unitType:
          type: string
          description: The code of the unit type.
        parentExternalId:
          type: string
          description: The external ID of the parent with the same source. A root
            has none.
        parentId:
          type: string
          description: "The ID of the parent, for a parent that has no external ID\
            \ with the same source. Give this or `parentExternalId`, not both."
        displayOrder:
          type: integer
          format: int32
          description: The position among siblings.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        validFrom:
          type: string
          description: "The first date of a new unit. The default is the effective\
            \ date. A row of a stored unit can leave it out or give the first date\
            \ of the unit, not of its details. Another date fails."
          format: date
        validTo:
          type: string
          description: The first date on which the unit no longer exists.
          format: date
        id:
          type: string
          description: "The ID of a stored unit, for a row of a unit with no external\
            \ ID. A CSV export has it in every row. A new unit has none."
        successorExternalIds:
          type: array
          items:
            type: string
          description: "The external IDs of the units that follow this one from `validTo`,\
            \ with the same source. A row with successors needs `validTo`. The end\
            \ and the successors are one write."
        successorIds:
          type: array
          items:
            type: string
          description: The IDs of the units that follow this one from `validTo`.
        organizationAlias:
          type: string
          description: The alias of the Keycloak organization that the unit is linked
            to. A row that leaves it out keeps the link. An empty text removes it.
        timeZone:
          type: string
          description: "The time zone of the unit and the units below, for example\
            \ `Asia/Tokyo`. A row that leaves it out keeps it. An empty text removes\
            \ it."
        dayStart:
          type: string
          description: "The time of day when the date changes, as `HH:mm`. A row that\
            \ leaves it out keeps it. An empty text removes it."
        workLocation:
          type: string
          description: The code of the work location that the unit gives its members.
        costCenter:
          type: string
          description: The code of the cost center that the unit gives its members.
    ImportPersonRow:
      type: object
      description: "A person, also one with no Keycloak user. It is matched by its\
        \ ID in the system of `source`, whichever system made it, or by `id`. A row\
        \ needs one of them."
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the person in that system.
        username:
          type: string
          description: The username of a Keycloak user to link. A row that names no
            user keeps the link that is stored.
        userId:
          type: string
          description: The ID of a Keycloak user to link.
        primaryLanguage:
          type: string
          description: "The language tag of the primary names, such as `ja`. It is\
            \ a key of `names`."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PersonName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`.\
            \ A person with no user needs them."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values of the person.
        id:
          type: string
          description: "The ID of a stored person, for a row of a person with no external\
            \ ID. A CSV export has it in every row. A new person has none."
    ImportQualificationRow:
      type: object
      required:
      - kind
      description: "A qualification of a person, such as a license. It is matched\
        \ by its ID in the system of `source`, whichever system made it, or by `id`.\
        \ A row needs one of them. A row of a stored one replaces its kind, number,\
        \ dates, and attributes, as `PUT` does."
      properties:
        id:
          type: string
          description: The ID of a stored qualification. A CSV export has it in every
            row.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the qualification in that system.
        personExternalId:
          type: string
          description: "The external ID of the person, with the same source. Give\
            \ one of the three ways to name the person. A row of a stored qualification\
            \ may name nobody."
        personId:
          type: string
          description: The ID of the person.
        username:
          type: string
          description: "The username of the person. The person of the user is used,\
            \ and created when the user has none."
        kind:
          type: string
          description: The code of a reference item of the kind `QUALIFICATION`.
        number:
          type: string
          maxLength: 255
          description: "The number, for example of a license."
        validFrom:
          type: string
          description: The first date. A new qualification starts on the effective
            date by default. A stored one keeps its start by default.
          format: date
        validTo:
          type: string
          description: The first date on which it no longer holds. None for no end.
          format: date
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    ImportRefItemRow:
      type: object
      required:
      - primaryLanguage
      - names
      description: "A reference item. It is matched by its ID in the system of `source`,\
        \ or by `id`. A row needs one of them. The kind and the code of a stored item\
        \ do not change."
      properties:
        id:
          type: string
          description: The ID of a stored item. A CSV export has it in every row.
            A new item has none.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the item in that system.
        kind:
          type: string
          description: "A fixed kind such as `UNIT_TYPE`, or the code of a kind that\
            \ the realm added. A row of a stored item may leave it out."
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that no other item of the kind has. A row of a stored
            item may leave it out.
        primaryLanguage:
          type: string
          description: "The language tag of the primary name, such as `ja`. It is\
            \ a key of `names`."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RefItemName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`."
        displayOrder:
          type: integer
          format: int32
          description: The position in lists.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        active:
          type: boolean
          description: False to stop the use of the item for new data.
          default: true
        legalEntity:
          type: boolean
          description: True for a unit type whose org units are legal entities. A
            row that leaves it out keeps the mark of a stored item.
        actingHead:
          type: boolean
          description: True for an assignment kind whose heads stand in for an absent
            head. A row that leaves it out keeps the mark of a stored item.
        lateral:
          type: boolean
          description: "True for a unit type whose org units are lateral units, outside\
            \ the line organization. A row that leaves it out keeps the mark of a\
            \ stored item."
        rollup:
          type: boolean
          description: "True for a unit type whose org units are rollup units, which\
            \ gather units in another hierarchy and are not in the default hierarchy.\
            \ A row that leaves it out keeps the mark of a stored item."
        validFrom:
          type: string
          description: The first date of the names of the row. A new item without
            it has names that hold for every date. A stored item without it gets the
            names from the effective date. A date that starts stored names corrects
            them.
          format: date
    ImportRefKindRow:
      type: object
      required:
      - primaryLanguage
      - names
      description: "A kind of reference data that the realm adds. It is matched by\
        \ its ID in the system of `source`, or by `id`. A row needs one of them. A\
        \ row of a stored kind changes its names. The code does not change."
      properties:
        id:
          type: string
          description: The ID of a stored kind. A CSV export has it in every row.
            A new kind has none.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the kind in that system.
        code:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that no other kind has. A row of a stored kind may leave
            it out.
        primaryLanguage:
          type: string
          description: "The language tag of the primary name, such as `ja`. It is\
            \ a key of `names`."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RefKindName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`."
    ImportReport:
      required:
      - dryRun
      - applied
      - counts
      - errors
      description: "What an import did, or would do."
      type: object
      properties:
        dryRun:
          type: boolean
          description: True when the request asked for a dry run.
        applied:
          type: boolean
          description: True when the rows were written. It is false for a dry run
            and when a row failed.
        counts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ImportCounts"
          description: The number of rows by outcome for each list of the document.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
          description: "The rows that could not be applied. When this is not empty,\
            \ nothing was written."
    ImportReportingLineRow:
      type: object
      description: "A reporting line from an assignment to a manager. It is matched\
        \ by its ID in the system of `source`, or by `id`. A row needs one of them.\
        \ The assignment, the manager, the kind, and the start of a stored line do\
        \ not change. A row with another value fails. A row that leaves one out keeps\
        \ the stored value. A new solid line fails while the assignment has a solid\
        \ line on the same dates."
      properties:
        id:
          type: string
          description: The ID of a stored line. A CSV export has it in every row.
            A new line has none.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row and its external IDs come
            from. The default is the source of the document.
        externalId:
          type: string
          description: The ID of the line in that system. A different line needs a
            different ID.
        assignmentExternalId:
          type: string
          description: The external ID of the assignment of the person who reports.
            Give this or `assignmentId`.
        assignmentId:
          type: string
          description: The ID of the assignment.
        managerPersonExternalId:
          type: string
          description: The external ID of the person who is the manager. Give one
            of the three ways to name the manager.
        managerPersonId:
          type: string
          description: The ID of the person who is the manager.
        managerUsername:
          type: string
          description: "The username of the manager. The person of the user is used,\
            \ and created when the user has none."
        kind:
          type: string
          default: SOLID
          enum:
          - SOLID
          - DOTTED
        validFrom:
          type: string
          description: The first date of a new line. The default is the effective
            date. A row of a stored line can leave it out or give the start of the
            line. Another date fails.
          format: date
        validTo:
          type: string
          description: The first date on which the line no longer holds. The default
            is the end of the assignment.
          format: date
    ImportRowError:
      type: object
      required:
      - list
      - row
      - error
      - message
      description: A row that could not be applied.
      properties:
        list:
          type: string
          description: The name of the list in the document.
        row:
          type: integer
          format: int32
          description: "The position of the row in its list, counted from 0."
        line:
          type: integer
          format: int32
          description: "The line number in the CSV file, counted from 1. Only a CSV\
            \ import has it."
        error:
          type: string
          description: The stable error code.
        params:
          type: object
          additionalProperties:
            type: string
          description: The values that the message refers to.
        message:
          type: string
          description: The message for people.
    ImportUnitRoleRow:
      type: object
      description: "A role that an employment holds over an org unit. It is matched\
        \ by its ID in the system of `source`, or by `id`. A row needs one of them.\
        \ The employment, the org unit, the role, `includesDescendants`, and the start\
        \ of a stored role do not change. A row with another value fails. A row that\
        \ leaves one out keeps the stored value."
      properties:
        id:
          type: string
          description: The ID of a stored role. A CSV export has it in every row.
            A new role has none.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row and its external IDs come
            from. The default is the source of the document.
        externalId:
          type: string
          description: The ID of the role in that system. A different role needs a
            different ID.
        employmentExternalId:
          type: string
          description: The external ID of the employment. Give this or `employmentId`.
        employmentId:
          type: string
          description: The ID of the employment.
        orgUnitExternalId:
          type: string
          description: The external ID of the org unit. Give this or `orgUnitId`.
        orgUnitId:
          type: string
          description: The ID of the org unit.
        role:
          type: string
          description: The code of a reference item of the kind `UNIT_ROLE`.
        includesDescendants:
          type: boolean
          description: True when the role also covers the units below.
          default: false
        validFrom:
          type: string
          description: The first date of a new role. The default is the effective
            date. A row of a stored role can leave it out or give the start of the
            role. Another date fails.
          format: date
        validTo:
          type: string
          description: The first date on which the role no longer holds. The default
            is the end of the employment.
          format: date
    JobRun:
      description: "The last run of a long job, also one that the timer started."
      type: object
      properties:
        job:
          type: string
          enum:
          - projection
          - sync
        state:
          type: string
          description: "`ABANDONED` is a run that still showed `RUNNING` after six\
            \ hours, for example because its node stopped."
          enum:
          - RUNNING
          - DONE
          - FAILED
          - ABANDONED
        startedAt:
          type: string
        endedAt:
          type: string
          description: It is missing while the run goes on.
        report:
          type: object
          additionalProperties: {}
          description: The counts of the report of a run that is done. A list counts
            as its size.
        error:
          type: string
          description: The code of the error of a failed run.
    Leave:
      required:
      - version
      - validFrom
      description: A request to put a person on leave.
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the employment that the caller read.
        validFrom:
          type: string
          description: The first date of the leave.
          format: date
        validTo:
          type: string
          description: The first date back at work. Leave it out when it is not known
            yet. On that date the status of before the leave comes back.
          format: date
        reason:
          type: string
          description: The code of the leave reason.
    Mask:
      required:
      - personId
      - version
      - maskedAt
      - keycloakNameCleared
      description: The result of a masking.
      type: object
      properties:
        personId:
          type: string
        version:
          type: integer
          format: int64
          description: The version of the person after the mask.
        userId:
          type: string
          description: The ID of the Keycloak user that the person is linked to.
        maskedAt:
          type: string
          description: "When the data was first masked, in UTC."
          format: date-time
        keycloakNameCleared:
          type: boolean
          description: "True when this request emptied the name of the linked Keycloak\
            \ user. False when the request did not ask for it, or the person has no\
            \ linked user."
    Member:
      required:
      - assignmentId
      - employmentId
      - personId
      - seconded
      - orgUnitId
      - orgUnitName
      - validFrom
      - head
      - primary
      - displayOrder
      - status
      description: One assignment of one person on one date.
      type: object
      properties:
        assignmentId:
          type: string
        version:
          type: integer
          format: int64
          description: The version of the assignment.
          readOnly: true
        employmentId:
          type: string
        personId:
          type: string
          description: The ID of the person.
        userId:
          type: string
          description: The ID of the Keycloak user that the person is linked to.
        employerId:
          type: string
          description: The ID of the org unit that employs the person.
        seconded:
          type: boolean
          description: True when the person works outside the employer. The org unit
            is then not the employer and not below it in the default hierarchy.
        staffNumber:
          type: string
          description: The number that the legal entity gives to the person.
        orgUnitId:
          type: string
        orgUnitName:
          type: string
          description: "The name of the org unit on the date, in the language of the\
            \ request."
        orgUnitPath:
          type: array
          items:
            $ref: "#/components/schemas/PathEntry"
          description: The units from the root down to the org unit. Only present
            when asked for.
        validFrom:
          type: string
          description: The first date of these details of the assignment.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        workLocation:
          type: string
          description: The code of the work location of the assignment itself.
        costCenter:
          type: string
          description: The code of the cost center of the assignment itself.
        effectiveWorkLocation:
          type: string
          description: "The code of the work location that applies on the date. It\
            \ is the one of the assignment, else the one of the org unit, else the\
            \ one of the nearest unit above it in the default hierarchy."
        effectiveCostCenter:
          type: string
          description: "The code of the cost center that applies on the date. It is\
            \ the one of the assignment, else the one of the org unit, else the one\
            \ of the nearest unit above it in the default hierarchy."
        head:
          type: boolean
          description: True when the person leads the org unit.
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: "The position among the members of the org unit, lowest first."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        employmentType:
          type: string
          description: The code of the employment type on the date.
        grade:
          type: string
          description: The code of the grade on the date.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work on the date in percent.
    Move:
      required:
      - version
      - orgUnitId
      - validFrom
      description: "A request to move a person to another org unit on a date, and\
        \ its response."
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the assignment that the caller read.
          writeOnly: true
        orgUnitId:
          type: string
          description: The ID of the org unit where the person works from the date.
          writeOnly: true
        validFrom:
          type: string
          description: The first date in the new org unit.
          format: date
          writeOnly: true
        jobTitle:
          type: string
          description: The code of the job title in the new org unit. Leave it out
            to keep the job title.
          writeOnly: true
        head:
          type: boolean
          description: True when the person leads the new org unit. The flag of the
            old org unit is not kept.
          writeOnly: true
          default: false
        displayOrder:
          type: integer
          format: int32
          description: The position among the members of the new org unit.
          writeOnly: true
          default: 0
        workLocation:
          type: string
          description: The code of the work location in the new org unit. Leave it
            out to take the one of the new org unit. The one of the old assignment
            is not kept.
          writeOnly: true
        costCenter:
          type: string
          description: The code of the cost center in the new org unit. Leave it out
            to take the one of the new org unit. The one of the old assignment is
            not kept.
          writeOnly: true
        ended:
          description: "The assignment to the old org unit, with its end."
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
        started:
          description: The assignment to the new org unit.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
    MovedEmployment:
      type: object
      required:
      - personId
      - endedEmploymentId
      - startedEmploymentId
      description: One person who moved to the new employer.
      properties:
        personId:
          type: string
        endedEmploymentId:
          type: string
          description: The ID of the employment at the old employer.
        startedEmploymentId:
          type: string
          description: The ID of the employment at the new employer.
    OrgUnit:
      type: object
      required:
      - primaryLanguage
      - names
      - validFrom
      description: An org unit as it is on one date.
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the unit. A new unit has 1. Each write counts\
            \ it up by one, also a change of a period, of a parent, or of an ID of\
            \ another system. A write of a stored unit sends the version that the\
            \ caller read. A create needs none."
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "A code that no other org unit has on the same date. It is\
            \ part of the details, so it can change on a date. A change of details\
            \ that leaves it out clears it."
        name:
          type: string
          description: "The name in the language of the request. It is the one of\
            \ the first language of `Accept-Language`, else the one of that language\
            \ with no region, such as `en` for `en-US`, else the primary one. A request\
            \ with no `Accept-Language` reads the primary one."
          readOnly: true
        shortName:
          type: string
          description: The short name in the language of `name`.
          readOnly: true
        phoneticName:
          type: string
          description: The reading of the name in the language of `name`.
          readOnly: true
        primaryLanguage:
          type: string
          maxLength: 64
          description: "The language tag of the primary names, such as `ja`. It is\
            \ a key of `names`. The Keycloak group of the unit has the primary name."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/OrgUnitName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`.\
            \ A read gives the tags in their standard form, such as `en-US` for `en-us`."
        unitType:
          type: string
          description: The code of the unit type.
        workLocation:
          type: string
          description: The code of the work location that the unit gives its members.
            Leave it out to take the one of the nearest unit above.
        costCenter:
          type: string
          description: The code of the cost center that the unit gives its members.
            Leave it out to take the one of the nearest unit above.
        effectiveWorkLocation:
          type: string
          description: "The code of the work location that applies on the date. It\
            \ is the one of the unit, else the one of the nearest unit above it in\
            \ the default hierarchy. A history has none."
          readOnly: true
        effectiveCostCenter:
          type: string
          description: "The code of the cost center that applies on the date. It is\
            \ the one of the unit, else the one of the nearest unit above it in the\
            \ default hierarchy. A history has none."
          readOnly: true
        legalEntity:
          type: boolean
          description: "True when the unit type marks the unit as a legal entity,\
            \ such as a company."
          readOnly: true
        lateral:
          type: boolean
          description: "True when the unit type marks the unit as a lateral unit outside\
            \ the line organization, such as a committee."
          readOnly: true
        rollup:
          type: boolean
          description: "True when the unit type marks the unit as a rollup unit, such\
            \ as a region. A rollup unit gathers units in another hierarchy and is\
            \ not in the default hierarchy."
          readOnly: true
        parentId:
          type: string
          description: The ID of the parent in the default hierarchy. A root and a
            rollup unit have none.
        validFrom:
          type: string
          description: The first date of these details.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
          readOnly: true
        displayOrder:
          type: integer
          format: int32
          description: "The position among siblings, lowest first."
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          maxLength: 255
          description: "The ID of the unit in the system that `source` names. A write\
            \ stores it as the ID of that system, in place of the one that the system\
            \ had. A read gives every ID in `externalIds`."
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "The name of the system that made the unit. A create sets it,\
            \ and it never changes. With `externalId`, it names the system of that\
            \ ID."
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the unit. The one of `source`\
            \ comes first, then the others by system."
          readOnly: true
        keycloakOrganizationId:
          type: string
          description: The ID of the linked Keycloak organization.
          readOnly: true
        timeZone:
          type: string
          description: The time zone that the unit sets for itself and the units below
            it.
          readOnly: true
        dayStart:
          type: string
          description: The day start that the unit sets for itself and the units below
            it.
          readOnly: true
    OrgUnitHistory:
      required:
      - id
      - externalIds
      - versions
      - parents
      description: Everything that is stored about an org unit over time.
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
          description: "The version of the unit. A new unit has 1. Each write counts\
            \ it up by one, also a change of a period, of a parent, or of an ID of\
            \ another system."
          readOnly: true
        source:
          type: string
          description: The name of the system that made the unit.
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the unit. The one of `source`\
            \ comes first, then the others by system."
        versions:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnit"
          description: "The details of each period, oldest first. They have no parent."
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ParentPeriod"
          description: "The parents in every hierarchy, oldest first. A gap in a hierarchy\
            \ means that the unit had no parent there."
    OrgUnitName:
      required:
      - name
      description: The names of an org unit in one language.
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        shortName:
          type: string
          maxLength: 255
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name. The one of the primary language sorts
            the units.
    OrgUnitSuccessionLink:
      type: object
      required:
      - orgUnitId
      - effectiveDate
      properties:
        orgUnitId:
          type: string
          description: The ID of the other org unit.
        effectiveDate:
          type: string
          description: The first date on which the old unit no longer exists.
          format: date
    OrgUnitSuccessions:
      required:
      - predecessors
      - successors
      description: "The org units that an org unit follows, and the ones that follow\
        \ it."
      type: object
      properties:
        predecessors:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnitSuccessionLink"
          description: The units that this unit follows. Several of them mean a merger.
        successors:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnitSuccessionLink"
          description: The units that follow this unit. Several of them mean a split.
    OrganizationLink:
      required:
      - version
      description: The link of an org unit to a Keycloak organization.
      type: object
      properties:
        orgUnitId:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: The version of the org unit. A request sends the one that the
            caller read. A response has the one after the write.
        organizationId:
          type: string
          description: The ID of the Keycloak organization. A request to link needs
            it. A response has none after the link was removed.
    ParentChange:
      required:
      - version
      - validFrom
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the org unit that the caller read.
        parentId:
          type: string
          description: The ID of the new parent. Leave it out to make the unit a root.
        validFrom:
          type: string
          description: The first date under the new parent.
          format: date
    ParentPeriod:
      type: object
      required:
      - hierarchy
      - parentId
      - validFrom
      description: The parent of an org unit for a period.
      properties:
        hierarchy:
          type: string
          description: The code of the hierarchy that the parent belongs to.
        parentId:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          description: The first date after the period. It is missing for no end.
          format: date
    PathEntry:
      type: object
      required:
      - id
      - name
      description: One org unit on the way from the root.
      properties:
        id:
          type: string
        name:
          type: string
          description: "The name of the org unit on the date, in the language of the\
            \ request."
    Person:
      description: A person that the realm knows. A person does not need a Keycloak
        user.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the person. A new person has 1. Each write\
            \ counts it up by one, also a mask or a change of an ID of another system.\
            \ A write of a stored person sends the version that the caller read. A\
            \ create needs none."
        userId:
          type: string
          description: The ID of the linked Keycloak user. One user is linked to at
            most one person.
        name:
          type: string
          description: "The name in the language of the request. It is the one of\
            \ the first language of `Accept-Language`, else the one of that language\
            \ with no region, such as `en` for `en-US`, else the primary one. A request\
            \ with no `Accept-Language` reads the primary one. When the record has\
            \ no names, it is the name of the linked user from Keycloak."
          readOnly: true
        nameSource:
          type: string
          description: Where the name of a response came from. `RECORD` is the person
            record. `KEYCLOAK` is the linked user. It is missing when there is no
            name.
          readOnly: true
          enum:
          - RECORD
          - KEYCLOAK
        phoneticName:
          type: string
          description: The reading of the name in the language of `name`.
          readOnly: true
        primaryLanguage:
          type: string
          maxLength: 64
          description: "The language tag of the primary names, such as `ja`. It is\
            \ a key of `names`. A person with no names has none."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PersonName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`.\
            \ A read gives the tags in their standard form, such as `en-US` for `en-us`.\
            \ A person with no linked user needs them. A person with a linked user\
            \ can have none, and a response then has the name of the user in `name`."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          maxLength: 255
          description: "The ID of the person in the system that `source` names. A\
            \ write stores it as the ID of that system, in place of the one that the\
            \ system had. A read gives every ID in `externalIds`."
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "The name of the system that made the person. A create sets\
            \ it, and it never changes. With `externalId`, it names the system of\
            \ that ID."
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the person. The one of `source`\
            \ comes first, then the others by system."
          readOnly: true
    PersonName:
      required:
      - name
      description: The names of a person in one language.
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
    ProjectionReport:
      required:
      - organizations
      - groupsCreated
      - groupsRenamed
      - groupsMoved
      - groupsRemoved
      - membersJoined
      - membersLeft
      - organizationMembersAdded
      - organizationMembersRemoved
      - realmGroupTrees
      description: What a rebuild of the projection changed in Keycloak.
      type: object
      properties:
        organizations:
          type: integer
          format: int32
          description: The number of linked organizations that were projected.
        groupsCreated:
          type: integer
          format: int32
          description: The number of groups that were created.
        groupsRenamed:
          type: integer
          format: int32
          description: The number of groups that got a new name.
        groupsMoved:
          type: integer
          format: int32
          description: The number of groups that got a new parent.
        groupsRemoved:
          type: integer
          format: int32
          description: The number of groups that were removed.
        membersJoined:
          type: integer
          format: int32
          description: The number of group memberships that were added.
        membersLeft:
          type: integer
          format: int32
          description: The number of group memberships that were removed.
        organizationMembersAdded:
          type: integer
          format: int32
          description: The number of users who became members of an organization.
        organizationMembersRemoved:
          type: integer
          format: int32
          description: The number of users who were taken out of an organization that
            the projection had added them to.
        realmGroupTrees:
          type: integer
          format: int32
          description: "1 when the tree was mirrored into realm groups, 0 when the\
            \ realm does not do it."
    Promotion:
      required:
      - version
      - validFrom
      description: "A request to promote a person on a date, and its response. The\
        \ request names a grade, a job title, or a head flag, or several of them."
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the employment that the caller read.
          writeOnly: true
        validFrom:
          type: string
          description: The first date of the new values.
          format: date
          writeOnly: true
        grade:
          type: string
          description: The code of the new grade. Leave it out to keep the grade.
          writeOnly: true
        jobTitle:
          type: string
          description: The code of the new job title. Leave it out to keep the job
            title.
          writeOnly: true
        assignmentId:
          type: string
          description: The ID of the assignment that gets the job title and the head
            flag. The default is the primary assignment of the employment on the date.
          writeOnly: true
        head:
          type: boolean
          description: Whether the person leads the org unit from the date. Leave
            it out to keep the flag.
          writeOnly: true
        employment:
          description: The employment with all its terms.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        assignment:
          description: The assignment with all its details. It is absent when the
            request named no job title and no head flag.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
    Qualification:
      required:
      - kind
      - validFrom
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the qualification. A new qualification has\
            \ 1. Each write counts it up by one, also a change of an ID of another\
            \ system. A write of a stored qualification sends the version that the\
            \ caller read. A create needs none."
        personId:
          type: string
          description: The ID of the person. Only a request to add reads it.
        userId:
          type: string
          description: "The ID of the Keycloak user that the person is linked to.\
            \ A request to add can give it in place of `personId`. The person of the\
            \ user is then used, and created when the user has none."
        kind:
          type: string
          description: The code of the qualification kind.
        number:
          type: string
          maxLength: 255
          description: The number of the license or certificate.
        validFrom:
          type: string
          description: The first date on which the qualification is valid.
          format: date
        validTo:
          type: string
          description: The first date on which it is no longer valid. It is missing
            for no end.
          format: date
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          maxLength: 255
          description: "The ID of the qualification in the system that `source` names.\
            \ A write stores it as the ID of that system, in place of the one that\
            \ the system had. A read gives every ID in `externalIds`."
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "The name of the system that made the qualification. A create\
            \ sets it, and it never changes. With `externalId`, it names the system\
            \ of that ID."
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the qualification. The one\
            \ of `source` comes first, then the others by system."
          readOnly: true
    RealmExport:
      description: "Every stored row of a realm, with every period. `POST /restore`\
        \ loads it into a realm that has no data of the extension, or in place of\
        \ the data of a realm. Each resource has its `version`, which the restore\
        \ keeps. A resource with none starts at 1."
      type: object
      properties:
        format:
          type: string
          description: The name and the version of the format.
          examples:
          - fuhito.export.v1
        refKinds:
          type: array
          items:
            $ref: "#/components/schemas/ExportRefKind"
        refItems:
          type: array
          items:
            $ref: "#/components/schemas/ExportRefItem"
        attributeDefinitions:
          type: array
          items:
            $ref: "#/components/schemas/ExportAttributeDefinition"
        hierarchies:
          type: array
          items:
            $ref: "#/components/schemas/ExportHierarchy"
        orgUnits:
          type: array
          items:
            $ref: "#/components/schemas/ExportOrgUnit"
        people:
          type: array
          items:
            $ref: "#/components/schemas/ExportPerson"
        employments:
          type: array
          items:
            $ref: "#/components/schemas/ExportEmployment"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ExportAssignment"
        reportingLines:
          type: array
          items:
            $ref: "#/components/schemas/ExportReportingLine"
        unitRoles:
          type: array
          items:
            $ref: "#/components/schemas/ExportUnitRole"
        qualifications:
          type: array
          items:
            $ref: "#/components/schemas/ExportQualification"
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExportExternalId"
        changeOrders:
          type: array
          items:
            $ref: "#/components/schemas/ExportChangeOrder"
        erasures:
          type: array
          items:
            $ref: "#/components/schemas/ExportErasure"
    RefItem:
      required:
      - primaryLanguage
      - names
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the item. A new item has 1. Each write counts\
            \ it up by one, also a change of an ID of another system. A write of a\
            \ stored item sends the version that the caller read. A create needs none."
        kind:
          type: string
          description: "A fixed kind such as `UNIT_TYPE`, or the code of a kind that\
            \ the realm added. Only a create request reads it."
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: Only a create request reads it.
        name:
          type: string
          description: "The name of the date in the language of the request. It is\
            \ the one of the first language of `Accept-Language`, else the one of\
            \ that language with no region, such as `en` for `en-US`, else the primary\
            \ one. A request with no `Accept-Language` reads the primary one."
          readOnly: true
        primaryLanguage:
          type: string
          maxLength: 64
          description: "The language tag of the primary name, such as `ja`. It is\
            \ a key of `names`."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RefItemName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`.\
            \ A read gives the names of its date, with the tags in their standard\
            \ form, such as `en-US` for `en-us`."
        displayOrder:
          type: integer
          format: int32
          description: "The position in lists, lowest first."
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        active:
          type: boolean
          description: False when the item must not be used for new data.
          default: true
        legalEntity:
          type: boolean
          description: "True for a unit type whose org units are legal entities, such\
            \ as a company. Only the kind `UNIT_TYPE` can have it."
          default: false
        actingHead:
          type: boolean
          description: True for an assignment kind whose heads stand in for an absent
            head. Only the kind `ASSIGNMENT_KIND` can have it.
          default: false
        lateral:
          type: boolean
          description: "True for a unit type whose org units are lateral units. A\
            \ lateral unit cuts across the line organization, such as a committee\
            \ or a project team. Only the kind `UNIT_TYPE` can have it. It cannot\
            \ change while an org unit has the type."
          default: false
        rollup:
          type: boolean
          description: "True for a unit type whose org units are rollup units. A rollup\
            \ unit gathers units in another hierarchy, such as a region, and is not\
            \ in the default hierarchy. Only the kind `UNIT_TYPE` can have it, and\
            \ not with `lateral` or `legalEntity`. It cannot change while an org unit\
            \ has the type."
          default: false
        validFrom:
          type: string
          description: The first date of the names. A create without it gives names
            that hold for every date. A change without it changes the names of today.
            A change with it keeps the old names for the dates before. A read leaves
            it out for names that hold from the start.
          format: date
        validTo:
          type: string
          description: The first date after the names. It is missing for no end.
          format: date
          readOnly: true
        externalId:
          type: string
          maxLength: 255
          description: The ID of the item in the system that `source` names. Only
            a create reads it. A read gives every ID in `externalIds`.
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system of `externalId`. Only a create reads
            it.
          writeOnly: true
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the item, by system."
          readOnly: true
    RefItemHistory:
      required:
      - id
      - version
      - kind
      - code
      - externalIds
      - versions
      description: Every period of the names of a reference item. The other values
        of the item have no dates.
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
          description: The version of the item. A write of names counts it up too.
          readOnly: true
        kind:
          type: string
        code:
          type: string
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the item, by system."
        versions:
          type: array
          items:
            $ref: "#/components/schemas/RefItemNames"
          description: "The names of each period, oldest first."
    RefItemName:
      required:
      - name
      description: The name of a reference item in one language.
      type: object
      properties:
        name:
          type: string
          maxLength: 255
    RefItemNames:
      type: object
      required:
      - name
      - primaryLanguage
      - names
      description: The names of a reference item for a period.
      properties:
        validFrom:
          type: string
          description: The first date. It is missing for names that hold from the
            start.
          format: date
        validTo:
          type: string
          description: The first date after the period. It is missing for no end.
          format: date
        name:
          type: string
          description: "The name in the language of the request, as `GET /ref-items/{id}`\
            \ gives it."
        primaryLanguage:
          type: string
          description: The language tag of the primary name. It is a key of `names`.
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RefItemName"
          description: The names by language tag.
    RefKind:
      type: string
      enum:
      - UNIT_TYPE
      - JOB_TITLE
      - OCCUPATION
      - EMPLOYMENT_TYPE
      - GRADE
      - END_REASON
      - ASSIGNMENT_KIND
      - QUALIFICATION
      - LEAVE_REASON
      - UNIT_ROLE
      - WORK_LOCATION
      - COST_CENTER
      description: The kinds of reference items. Each realm defines its own items
        for each kind.
    RefKindDefinition:
      required:
      - code
      - primaryLanguage
      - names
      description: A kind of reference data.
      type: object
      properties:
        id:
          type: string
          description: The ID of a kind that the realm added. A fixed kind has none.
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The code that items name as their kind.
        name:
          type: string
          description: "The name in the language of the request. It is the one of\
            \ the first language of `Accept-Language`, else the one of that language\
            \ with no region, such as `en` for `en-US`, else the primary one. A request\
            \ with no `Accept-Language` reads the primary one. A fixed kind has none."
          readOnly: true
        primaryLanguage:
          type: string
          maxLength: 64
          description: "The language tag of the primary name, such as `ja`. It is\
            \ a key of `names`. A fixed kind has none."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RefKindName"
          description: "The names by language tag, such as `ja`, `en`, or `zh-Hant`.\
            \ A read gives the tags in their standard form, such as `en-US` for `en-us`.\
            \ A fixed kind has none."
        fixed:
          type: boolean
          description: True for a kind that every realm has.
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of a kind that the realm added. A new kind has\
            \ 1. Each write counts it up by one, also a change of an ID of another\
            \ system. A fixed kind has none. A write of a stored kind sends the version\
            \ that the caller read. A create needs none."
        externalId:
          type: string
          maxLength: 255
          description: The ID of the kind in the system that `source` names. Only
            a create reads it. A read gives every ID in `externalIds`.
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system of `externalId`. Only a create reads
            it.
          writeOnly: true
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the kind, by system."
          readOnly: true
    RefKindName:
      required:
      - name
      description: The name of a kind of reference data in one language.
      type: object
      properties:
        name:
          type: string
          maxLength: 255
    Reorganization:
      required:
      - effectiveDate
      - steps
      description: "A request to change many org units on one date, and its response."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date of every step.
          format: date
          writeOnly: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReorganizationStep"
          description: "The steps, in the order to apply them."
          writeOnly: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReorganizationResult"
          description: "What each step did, in the same order."
          readOnly: true
    ReorganizationResult:
      type: object
      required:
      - op
      - unit
      description: What one step did.
      properties:
        op:
          type: string
          enum:
          - create
          - change
          - move
          - end
          - succeed
        unit:
          description: "The unit after the step. For an end and a succeed step, it\
            \ is the unit on its last date."
          type: object
          $ref: "#/components/schemas/OrgUnit"
        successorIds:
          type: array
          items:
            type: string
          description: "For a succeed step, the IDs of the units that follow the unit\
            \ that ended."
    ReorganizationStep:
      type: object
      required:
      - op
      description: One operation of a reorganization.
      properties:
        op:
          type: string
          enum:
          - create
          - change
          - move
          - end
          - succeed
        ref:
          type: string
          description: A name that later steps of the same request can use for the
            unit that a create step makes.
        id:
          type: string
          description: "The ID of the unit to change, move, end, or succeed."
        unitRef:
          type: string
          description: "The `ref` of an earlier create step, in place of `id`."
        version:
          type: integer
          format: int64
          description: "The version of the unit of `id` that the caller read. A change,\
            \ move, end, or succeed step with `id` needs it. Two steps of one unit\
            \ name the same version."
        parentId:
          type: string
          description: The ID of the parent for a create or a move.
        parentRef:
          type: string
          description: "The `ref` of an earlier create step, in place of `parentId`."
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: "The code of a new unit, or of a unit after `change`. A `change`\
            \ that leaves it out clears it."
        primaryLanguage:
          type: string
          description: "The language tag of the primary names, for a create or a change.\
            \ It is a key of `names`."
        names:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/OrgUnitName"
          description: "The names by language tag, for a create or a change."
        unitType:
          type: string
          description: The code of the unit type.
        workLocation:
          type: string
          description: The code of the work location that the unit gives its members.
        costCenter:
          type: string
          description: The code of the cost center that the unit gives its members.
        displayOrder:
          type: integer
          format: int32
          description: The position among siblings.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        successorIds:
          type: array
          items:
            type: string
          description: "For a succeed step, the IDs of the units that follow the unit\
            \ that ends."
        successorRefs:
          type: array
          items:
            type: string
          description: "For a succeed step, the `ref` of earlier create steps, in\
            \ place of `successorIds`."
    Reporting:
      required:
      - personId
      - kind
      - derived
      - assignmentId
      - orgUnitId
      description: "One manager of a person, or one direct report of a person, on\
        \ a date."
      type: object
      properties:
        personId:
          type: string
          description: "The ID of the other person. It is the manager in a list of\
            \ managers, and the report in a list of reports."
        userId:
          type: string
          description: The ID of the Keycloak user that the other person is linked
            to.
        kind:
          $ref: "#/components/schemas/ReportingKind"
        derived:
          type: boolean
          description: True when no reporting line is stored and the head of the org
            unit is taken as the manager.
        lineId:
          type: string
          description: The ID of the stored reporting line. A derived entry has none.
        assignmentId:
          type: string
          description: The ID of the assignment of the person who reports.
        orgUnitId:
          type: string
          description: The ID of the org unit of that assignment.
    ReportingKind:
      type: string
      enum:
      - SOLID
      - DOTTED
      description: |
        `SOLID` is the main manager. An assignment has at most one at a time.
        `DOTTED` is a further manager, for example of a project.
    ReportingLine:
      required:
      - assignmentId
      - validFrom
      type: object
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the line. A new line has 1. Each write counts\
            \ it up by one, also a change of an ID of another system."
          readOnly: true
        assignmentId:
          type: string
          description: The ID of the assignment of the person who reports.
        managerPersonId:
          type: string
          description: The ID of the person who is the manager.
        managerUserId:
          type: string
          description: "The ID of the Keycloak user that the manager is linked to.\
            \ A request can give it in place of `managerPersonId`. The person of the\
            \ user is then used, and created when the user has none."
        kind:
          $ref: "#/components/schemas/ReportingKind"
          default: SOLID
        validFrom:
          type: string
          description: The first date of the line.
          format: date
        validTo:
          type: string
          description: The first date after the line. Leave it out to last as long
            as the assignment.
          format: date
        externalId:
          type: string
          maxLength: 255
          description: The ID of the line in the system that `source` names. Only
            a create reads it. A read gives every ID in `externalIds`.
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system of `externalId`. Only a create reads
            it.
          writeOnly: true
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the line, by system."
          readOnly: true
    Return:
      required:
      - version
      - validFrom
      description: A request to end the leave of a person.
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the employment that the caller read.
        validFrom:
          type: string
          description: The first date back at work.
          format: date
    RoleHolder:
      required:
      - id
      - employmentId
      - personId
      - orgUnitId
      - orgUnitName
      - role
      - roleName
      - includesDescendants
      - validFrom
      description: "A role that an employment holds over an org unit on one date,\
        \ with the names to show it."
      type: object
      properties:
        id:
          type: string
          description: The ID of the role.
        version:
          type: integer
          format: int64
          description: The version of the role. A new role has 1. Each write counts
            it up by one.
          readOnly: true
        employmentId:
          type: string
          description: The ID of the employment that holds the role.
        personId:
          type: string
          description: The ID of the person of the employment.
        userId:
          type: string
          description: The ID of the Keycloak user of the person.
        orgUnitId:
          type: string
          description: The ID of the org unit.
        orgUnitName:
          type: string
          description: "The name of the org unit on the date, in the language of the\
            \ request."
        role:
          type: string
          description: The code of a reference item of the kind `UNIT_ROLE`.
        roleName:
          type: string
          description: "The name of the reference item of the role on the date, in\
            \ the language of the request."
        includesDescendants:
          type: boolean
          description: True when the role also covers every unit below in the default
            hierarchy.
        validFrom:
          type: string
          description: The first date of the role.
          format: date
        validTo:
          type: string
          description: The first date after the role. It is missing for no end.
          format: date
    Staff:
      required:
      - orgUnitId
      - validFrom
      description: "A request to add a person to an org unit in one call, and its\
        \ response. The request starts an employment and adds its first assignment."
      type: object
      properties:
        personId:
          type: string
          description: The ID of the person.
          writeOnly: true
        userId:
          type: string
          description: "The ID of the Keycloak user, in place of `personId`. The person\
            \ of the user is used, and created when the user has none."
          writeOnly: true
        employerId:
          type: string
          description: The ID of the org unit that employs the person. Leave it out
            when the realm has exactly one legal entity.
          writeOnly: true
        orgUnitId:
          type: string
          writeOnly: true
        validFrom:
          type: string
          description: The first date of the employment and of the assignment.
          format: date
          writeOnly: true
        validTo:
          type: string
          description: The first date after both.
          format: date
          writeOnly: true
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person.
          writeOnly: true
        employmentType:
          type: string
          description: The code of the employment type.
          writeOnly: true
        grade:
          type: string
          description: The code of the grade.
          writeOnly: true
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
          writeOnly: true
        contractEndDate:
          type: string
          description: The last day of the fixed-term contract. Leave it out for an
            indefinite contract.
          format: date
          writeOnly: true
        jobTitle:
          type: string
          description: The code of the job title.
          writeOnly: true
        occupation:
          type: string
          description: The code of the occupation.
          writeOnly: true
        workLocation:
          type: string
          description: The code of the work location. Leave it out to take the one
            of the org unit.
          writeOnly: true
        costCenter:
          type: string
          description: The code of the cost center. Leave it out to take the one of
            the org unit.
          writeOnly: true
        head:
          type: boolean
          description: True when the person leads the org unit.
          writeOnly: true
          default: false
        primary:
          type: boolean
          description: False when this is not the main assignment.
          writeOnly: true
          default: true
        employment:
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        assignment:
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
    SyncFailed:
      type: object
      required:
      - userId
      - error
      description: "A user that the sync could not handle. Nothing of the user was\
        \ written, and the run went on with the other users. The next run tries the\
        \ user again."
      properties:
        userId:
          type: string
        error:
          type: string
          description: "The error code, as an error response has it. `internal` when\
            \ the error has no code. The log of the server then has the cause."
    SyncReport:
      required:
      - dryRun
      - users
      - employmentsStarted
      - assignmentsAdded
      - assignmentsMoved
      - assignmentsChanged
      - assignmentsEnded
      - reportingLinesChanged
      - unmatched
      - failed
      description: "What a sync from user attributes did, or would do."
      type: object
      properties:
        dryRun:
          type: boolean
          description: True when the request asked for a dry run.
        users:
          type: integer
          format: int32
          description: The number of users with a department.
        employmentsStarted:
          type: integer
          format: int32
          description: The number of employments that were started.
        assignmentsAdded:
          type: integer
          format: int32
          description: The number of assignments that were added.
        assignmentsMoved:
          type: integer
          format: int32
          description: The number of users whose assignment moved to another org unit.
        assignmentsChanged:
          type: integer
          format: int32
          description: The number of assignments whose job title changed. One that
            lost its title counts too.
        assignmentsEnded:
          type: integer
          format: int32
          description: The number of assignments that ended because the department
            was removed.
        reportingLinesChanged:
          type: integer
          format: int32
          description: The number of users whose reporting line changed.
        unmatched:
          type: array
          items:
            $ref: "#/components/schemas/SyncUnmatched"
          description: The values of user attributes that matched nothing.
        failed:
          type: array
          items:
            $ref: "#/components/schemas/SyncFailed"
          description: The users that the sync could not handle. The run went on with
            the other users.
    SyncUnmatched:
      type: object
      required:
      - userId
      - field
      - value
      - reason
      description: A value of a user attribute that matched nothing.
      properties:
        userId:
          type: string
        field:
          type: string
          enum:
          - department
          - title
          - manager
        value:
          type: string
        reason:
          type: string
          description: "`unknown` when nothing has the value, or when it names a deactivated\
            \ job title that the assignment does not have. `ambiguous` when more than\
            \ one org unit has the name."
          enum:
          - unknown
          - ambiguous
    TimeSettings:
      required:
      - version
      description: "The time settings of an org unit. They also hold for the units\
        \ below it, unless one of them has its own."
      type: object
      properties:
        orgUnitId:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: The version of the org unit. A request sends the one that the
            caller read. A response has the one after the write.
        timeZone:
          type: string
          description: The time zone. Leave it out to use the one from above.
          examples:
          - America/New_York
        dayStart:
          type: string
          description: "The time of day when the date changes, as `HH:mm`. Leave it\
            \ out to use the one from above."
          examples:
          - 05:00
    Transfer:
      required:
      - version
      - employerId
      - validFrom
      description: "A request to move a person to another employer on a date, and\
        \ its response."
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the employment at the old employer that the
            caller read.
          writeOnly: true
        employerId:
          type: string
          description: "The ID of the org unit that employs the person from the date.\
            \ It is a legal entity on that date, and not the employer of today."
          writeOnly: true
        validFrom:
          type: string
          description: The first date at the new employer.
          format: date
          writeOnly: true
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the new employer gives to the person.
          writeOnly: true
        endReason:
          type: string
          description: The code of the end reason of the old employment.
          writeOnly: true
        ended:
          description: "The employment at the old employer, with its end."
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        started:
          description: The employment at the new employer.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
          description: The assignments that the new employment got.
          readOnly: true
        reportingLines:
          type: array
          items:
            $ref: "#/components/schemas/ReportingLine"
          description: The reporting lines that the new assignments got.
          readOnly: true
        unitRoles:
          type: array
          items:
            $ref: "#/components/schemas/UnitRole"
          description: The roles over org units that the new employment got.
          readOnly: true
    Transfers:
      required:
      - fromEmployerId
      - toEmployerId
      - validFrom
      description: "A request to move every person of one employer to another employer\
        \ on a date, and its response. It is for a merger of two legal entities."
      type: object
      properties:
        fromEmployerId:
          type: string
          description: The ID of the org unit that employs the people today.
          writeOnly: true
        toEmployerId:
          type: string
          description: The ID of the org unit that employs them from the date. It
            is a legal entity on that date.
          writeOnly: true
        validFrom:
          type: string
          description: The first date at the new employer.
          format: date
          writeOnly: true
        endReason:
          type: string
          description: The code of the end reason of the old employments.
          writeOnly: true
        keepStaffNumbers:
          type: boolean
          description: True to keep the staff number of each person. A number that
            the new employer has given to another person rejects the request.
          writeOnly: true
          default: false
        staffNumbers:
          type: object
          additionalProperties:
            type: string
          description: "New staff numbers, by the ID of the old employment. They win\
            \ over `keepStaffNumbers`."
          writeOnly: true
        endEmployer:
          type: boolean
          description: "True to also end the old employer on the date. The request\
            \ is rejected when an employment, a child org unit, or an assignment would\
            \ still be there."
          writeOnly: true
          default: false
        transferred:
          type: integer
          format: int32
          description: The number of people who moved.
          readOnly: true
        employments:
          type: array
          items:
            $ref: "#/components/schemas/MovedEmployment"
          description: The old and the new employment of each person.
          readOnly: true
        endedEmployer:
          description: "The old employer with its end, when the request asked for\
            \ it."
          readOnly: true
          type: object
          $ref: "#/components/schemas/OrgUnit"
    UnitRole:
      type: object
      required:
      - employmentId
      - orgUnitId
      - role
      - validFrom
      description: "A role that an employment holds over an org unit without being\
        \ a member of it, such as the HR contact of a division."
      properties:
        id:
          type: string
          readOnly: true
        version:
          type: integer
          format: int64
          description: "The version of the role. A new role has 1. Each write counts\
            \ it up by one, also a change of an ID of another system."
          readOnly: true
        employmentId:
          type: string
          description: The ID of the employment that holds the role.
        personId:
          type: string
          description: The ID of the person of the employment.
          readOnly: true
        userId:
          type: string
          description: The ID of the Keycloak user of the person.
          readOnly: true
        orgUnitId:
          type: string
          description: The ID of the org unit.
        role:
          type: string
          description: The code of a reference item of the kind `UNIT_ROLE`.
        includesDescendants:
          type: boolean
          description: True when the role also covers every unit below in the default
            hierarchy.
          default: false
        validFrom:
          type: string
          description: The first date of the role.
          format: date
        validTo:
          type: string
          description: The first date after the role. Leave it out to last as long
            as the employment.
          format: date
        externalId:
          type: string
          maxLength: 255
          description: The ID of the role in the system that `source` names. Only
            a create reads it. A read gives every ID in `externalIds`.
          writeOnly: true
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system of `externalId`. Only a create reads
            it.
          writeOnly: true
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdPair"
          description: "Every ID that a system has for the role, by system."
          readOnly: true
    UserHistory:
      required:
      - employments
      - assignments
      description: Everything that is stored about one person over time.
      type: object
      properties:
        personId:
          type: string
          description: The ID of the person. A user with no person has none.
        userId:
          type: string
          description: The ID of the Keycloak user that the person is linked to.
        maskedAt:
          type: string
          description: "When the personal data of the person was masked, in UTC. It\
            \ is missing when it never was."
          format: date-time
        employments:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
          description: "The employments with their terms, oldest first."
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
          description: "The assignments with their details, oldest first."
    Version:
      required:
      - version
      type: object
      properties:
        version:
          type: string
    VersionCheck:
      required:
      - version
      description: The version of the resource that the caller read. The write goes
        on only when the resource still has it.
      type: object
      properties:
        version:
          type: integer
          format: int64
          description: The version of the resource that the caller read.
  parameters:
    changeOrder:
      description: |
        The ID of the change order that the write belongs to.
        A request that names an unknown change order gets 400 and writes nothing.
      in: query
      name: changeOrder
      schema:
        type: string
  responses:
    BadRequest:
      description: A value in the request is bad.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The request conflicts with existing data.
        A write with an old version gets it with `version.conflict`.
        A realm with no usable time zone also gets this status on every request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the permission.
    ImportFailed:
      description: |
        A row failed, and the body is the report with every bad row.
        Or the request itself is bad, and the body is an error.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: "#/components/schemas/ImportReport"
            - $ref: "#/components/schemas/Error"
    NotFound:
      description: The target does not exist in the realm.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request has no valid token.
  securitySchemes:
    bearer:
      type: http
      description: An access token for the admin API of Keycloak.
      scheme: bearer
      bearerFormat: JWT
info:
  description: |
    The API has no release yet and can still change.

    Dates have the form `YYYY-MM-DD`.
    A period includes its `validFrom` date and does not include its `validTo` date.

    A response leaves out every field that has no value.
    For example, an org unit with no end date has no `validTo` field.

    A read of the org structure needs the role `fuhito-view-structure`. Every other read needs
    `fuhito-view-people`. A write needs `fuhito-manage`. The roles are in the client
    `realm-management` of the realm.

    A write belongs to a change order when its request has the query parameter `changeOrder`.

    A write of a stored resource names the `version` of the resource that the caller read.
    It is in the body, or in the query of a `DELETE`. A write with no version fails with 400 and
    `version.required`. When the resource changed since the read, the write fails with 409 and
    `version.conflict`, and the values of the error have the current version.

    A failed request writes nothing.
  license:
    identifier: Apache-2.0
    name: "Apache License, Version 2.0"
  summary: Organization structure and its history for each Keycloak realm.
  title: keycloak-fuhito admin REST API
  version: 0.1.0
servers:
- url: "{baseUrl}/admin/realms/{realm}/fuhito"
  variables:
    baseUrl:
      description: The base URL of Keycloak.
      default: http://localhost:8080
    realm:
      description: The name of the realm.
      default: master
security:
- bearer: []
externalDocs:
  description: How the extension plugs into Keycloak
  url: https://github.com/exoego/keycloak-fuhito/blob/main/docs/keycloak-integration.md
paths:
  /:
    get:
      summary: Returns the version of this extension.
      operationId: getVersion
      tags:
      - general
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments:
    get:
      summary: "Lists the assignments of a date across the realm, ordered by ID, in\
        \ the shape of members."
      description: "To read every assignment, follow the `Link` header of each response."
      operationId: listAssignments
      tags:
      - assignments
      parameters:
      - description: The cursor from the `Link` header of the page before.
        name: after
        in: query
        schema:
          type: string
      - description: The date to read. The default is today in the time zone of the
          realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: The number of entries to skip. It cannot be used with `after`.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The code of a job title to keep.
        name: jobTitle
        in: query
        schema:
          type: string
      - description: The code of an assignment kind to keep.
        name: kind
        in: query
        schema:
          type: string
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: The code of an occupation to keep.
        name: occupation
        in: query
        schema:
          type: string
      - description: The ID of an org unit to keep. The units below do not count.
        name: orgUnitId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The assignments of the date.
          headers:
            Link:
              description: "The URL of the next page, with `rel=\"next\"`. It is there\
                \ when the page is full. A full page can be the last one, and the\
                \ next page is then empty."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      summary: Adds an assignment of an employment to an org unit.
      operationId: addAssignment
      tags:
      - assignments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignment"
        required: true
      responses:
