  /org-units/{id}/members:
    get:
      summary: Lists the assignments to an org unit that hold on a date.
      description: "To read every member, follow the `Link` header of each response.\
        \ A late page then costs as much as the first one."
      operationId: listOrgUnitMembers
      tags:
      - org-units
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: The cursor from the `Link` header of the page before. It is the
          name of its format and the values of the last row of that page. It cannot
          be used with `first`.
        name: after
        in: query
        schema:
          type: string
      - description: The date to read. The default is today for the org unit. It is
          the date of the realm unless a unit sets its own time zone.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: "The code of a cost center to keep. It keeps the members whose\
          \ cost center that applies on the date is this one. That is the one of the\
          \ assignment, else the one of its org unit, else the one of the nearest\
          \ unit above it in the default hierarchy."
        name: costCenter
        in: query
        schema:
          type: string
      - description: The number of entries to skip.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The code of the hierarchy. The default is the hierarchy `default`.
        name: hierarchy
        in: query
        schema:
          type: string
      - description: True to also list the members of every unit below.
        schema:
          type: boolean
          default: false
        name: includeDescendants
        in: query
      - description: The code of a job title to keep.
        name: jobTitle
        in: query
        schema:
          type: string
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: The code of an occupation to keep.
        name: occupation
        in: query
        schema:
          type: string
      - description: True to keep only the people who work outside the legal entity
          that employs them. False to keep everyone else. The default is everyone.
        name: seconded
        in: query
        schema:
          type: boolean
      - description: An employment status to keep.
        schema:
          $ref: "#/components/schemas/EmploymentStatus"
        name: status
        in: query
      - description: "The code of a work location to keep. It keeps the members whose\
          \ work location that applies on the date is this one. That is the one of\
          \ the assignment, else the one of its org unit, else the one of the nearest\
          \ unit above it in the default hierarchy."
        name: workLocation
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The members on the date.
          headers:
            Link:
              description: "The URL of the next page, with `rel=\"next\"`. It is there\
                \ when the page is full. A full page can be the last one, and the\
                \ next page is then empty."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
