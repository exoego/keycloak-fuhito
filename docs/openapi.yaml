---
tags:
- name: general
  summary: General
  kind: nav
  description: The version and the hierarchies.
- name: ref-items
  summary: Reference items
  kind: nav
  description: "The lists that a realm defines, such as unit types and occupations."
- name: org-units
  summary: Org units
  kind: nav
  description: "Org units, their tree on a date, and their history."
- name: employments
  summary: Employments
  kind: nav
  description: "Employments of users, with their terms over time."
- name: assignments
  summary: Assignments
  kind: nav
  description: Assignments of employments to org units.
- name: reporting-lines
  summary: Reporting lines
  kind: nav
  description: Links from an assignment to a manager.
- name: qualifications
  summary: Qualifications
  kind: nav
  description: Licenses and certificates of users.
- name: people
  summary: People
  kind: nav
  description: "The people that the realm knows, with or without a Keycloak user."
- name: users
  summary: Users
  kind: nav
  description: What is stored about one user.
- name: change-orders
  summary: Change orders and change log
  kind: nav
  description: "Approved instructions that cause changes, and the log of every write."
- name: bulk
  summary: Import
  kind: nav
  description: Many rows in one request.
- name: keycloak
  summary: Keycloak sync
  kind: nav
  description: "The projection into organization groups, and the sync from user attributes."
openapi: 3.2.0
components:
  schemas:
    Assignment:
      required:
      - employmentId
      - orgUnitId
      - validFrom
      description: A request to add an assignment gives the first details in the fields
        of the assignment itself. A response gives the details of every period in
        `periods`.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        employmentId:
          type: string
        userId:
          type: string
          description: The ID of the Keycloak user of the employment.
          readOnly: true
        orgUnitId:
          type: string
        validFrom:
          type: string
          description: The first date of the assignment.
          format: date
        validTo:
          type: string
          description: The first date after the assignment. It is missing for no end.
          format: date
        externalId:
          type: string
          description: The ID of the assignment in the system it came from.
        source:
          type: string
          description: The name of that system.
        continuesAssignmentId:
          type: string
          description: "The ID of the assignment that this one continues, after a\
            \ move to another org unit or a transfer to another employer."
          readOnly: true
        jobTitle:
          type: string
          description: The code of the first job title.
          writeOnly: true
        occupation:
          type: string
          description: The code of the first occupation.
          writeOnly: true
        kind:
          type: string
          description: The code of the first assignment kind.
          writeOnly: true
        head:
          type: boolean
          description: Whether the person leads the org unit at first.
          writeOnly: true
        primary:
          type: boolean
          description: Whether this is the main assignment at first.
          writeOnly: true
        switchPrimary:
          type: boolean
          description: True to take the primary flag away from other assignments of
            the employment for the same dates.
          writeOnly: true
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The first share of the person's work in percent.
          writeOnly: true
        displayOrder:
          type: integer
          format: int32
          description: The first position among the members of the org unit.
          writeOnly: true
        attributes:
          type: object
          additionalProperties: {}
          description: The first free values.
          writeOnly: true
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentDetails"
          description: "The details of each period, oldest first."
          readOnly: true
    AssignmentDetails:
      type: object
      required:
      - validFrom
      description: The details of an assignment for a period.
      properties:
        validFrom:
          type: string
          description: The first date of these details.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
          readOnly: true
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        head:
          type: boolean
          description: True when the person leads the org unit.
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
        switchPrimary:
          type: boolean
          description: True to take the primary flag away from other assignments of
            the employment for the same dates.
          writeOnly: true
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: "The position among the members of the org unit, lowest first."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    ChangeLogEntry:
      required:
      - id
      - sequence
      - recordedAt
      - actorUserId
      - resourceType
      - resourceId
      - operation
      - resourcePath
      description: One successful write.
      type: object
      properties:
        id:
          type: string
        sequence:
          type: integer
          format: int64
          description: "The position of the entry in the change log of the realm,\
            \ counted from 1."
        recordedAt:
          type: string
          description: "When the write happened, in UTC."
          format: date-time
        actorUserId:
          type: string
          description: The ID of the user who did the write.
        resourceType:
          type: string
          examples:
          - FUHITO_ORG_UNIT
        resourceId:
          type: string
        operation:
          type: string
          enum:
          - CREATE
          - UPDATE
          - DELETE
        resourcePath:
          type: string
          description: The path of the request below the realm.
          examples:
          - fuhito/org-units/123/end
        changeOrderId:
          type: string
          description: The ID of the change order that the write belongs to.
        representation:
          description: The state of the resource after the write. It is missing after
            a delete.
          type: object
          additionalProperties: true
    ChangeOrder:
      required:
      - title
      - effectiveDate
      type: object
      properties:
        id:
          type: string
          readOnly: true
        number:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the order.
        kind:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code for the kind of order that the realm chooses.
        title:
          type: string
          maxLength: 255
        note:
          type: string
          description: A longer text.
        orderDate:
          type: string
          description: The date when the order was issued.
          format: date
        effectiveDate:
          type: string
          description: The date from which the changes are true.
          format: date
        approverUserId:
          type: string
          description: The ID of the Keycloak user who approved the order.
        requesterUserId:
          type: string
          description: The ID of the Keycloak user who asked for the order.
        externalReference:
          type: string
          description: A reference to the order in another system.
        createdAt:
          type: string
          description: "When the order was stored, in UTC."
          format: date-time
          readOnly: true
        announcedAt:
          type: string
          description: "When the order was announced, in UTC. It is absent until someone\
            \ records the announcement. The extension hides nothing with it. An application\
            \ can hide the planned changes of an order that has none."
          format: date-time
          readOnly: true
        announcedByUserId:
          type: string
          description: The ID of the Keycloak user who recorded the announcement.
          readOnly: true
    EffectiveChange:
      required:
      - effectiveDate
      - resourceType
      - resourceId
      - resourcePath
      description: "The fact that something about a resource starts, changes, or ends\
        \ on a date."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date that a period of the resource starts or ends on.
          format: date
        resourceType:
          type: string
          enum:
          - FUHITO_ORG_UNIT
          - FUHITO_EMPLOYMENT
          - FUHITO_ASSIGNMENT
          - FUHITO_REPORTING_LINE
          - FUHITO_QUALIFICATION
        resourceId:
          type: string
        resourcePath:
          type: string
          description: The path of the resource below the realm.
          examples:
          - fuhito/org-units/123
    Employment:
      required:
      - validFrom
      description: A request to start an employment gives the first terms in the fields
        of the employment itself. It names the person by `personId` or by `userId`.
        A response gives the terms of every period in `terms`.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        personId:
          type: string
          description: The ID of the person.
        userId:
          type: string
          description: "The ID of the Keycloak user that the person is linked to.\
            \ A request can give it in place of `personId`. The person of the user\
            \ is then used, and created when the user has none."
        employerId:
          type: string
          description: "The ID of the org unit that employs the person. It is a legal\
            \ entity on the first date of the employment, and it never changes. A\
            \ request can leave it out when the realm has exactly one legal entity\
            \ on that date."
        validFrom:
          type: string
          description: The first date of the employment.
          format: date
        validTo:
          type: string
          description: The first date after the employment. It is missing for no end.
          format: date
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person.
        endReason:
          type: string
          description: The code of the end reason.
          readOnly: true
        externalId:
          type: string
          description: The ID of the employment in the system it came from.
        source:
          type: string
          description: The name of that system.
        continuesEmploymentId:
          type: string
          description: The ID of the employment that this one continues after a transfer
            to another employer.
          readOnly: true
        employmentType:
          type: string
          description: The code of the first employment type.
          writeOnly: true
        grade:
          type: string
          description: The code of the first grade.
          writeOnly: true
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          description: The first status.
          writeOnly: true
          default: ACTIVE
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The first share of full-time work in percent.
          writeOnly: true
        attributes:
          type: object
          additionalProperties: {}
          description: The first free values.
          writeOnly: true
        terms:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentTerms"
          description: "The terms of each period, oldest first."
          readOnly: true
    EmploymentStatus:
      type: string
      enum:
      - ACTIVE
      - ON_LEAVE
      - SUSPENDED
      description: Whether a person works during a period of an employment.
    EmploymentTerms:
      type: object
      required:
      - validFrom
      description: The conditions of an employment for a period.
      properties:
        validFrom:
          type: string
          description: The first date of these conditions.
          format: date
        validTo:
          type: string
          description: The first date after these conditions. It is missing for no
            end.
          format: date
          readOnly: true
        employmentType:
          type: string
          description: The code of the employment type.
        grade:
          type: string
          description: The code of the grade.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          default: ACTIVE
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    End:
      required:
      - validTo
      description: A request to end something on a date.
      type: object
      properties:
        validTo:
          type: string
          description: The first date on which it no longer exists.
          format: date
        endReason:
          type: string
          description: The code of the end reason. Only the end of an employment uses
            it.
    Error:
      required:
      - error
      - message
      type: object
      properties:
        error:
          type: string
          description: The stable error code.
        params:
          type: object
          additionalProperties:
            type: string
          description: The values that the message refers to.
        message:
          type: string
          description: The message for people. Its text can change. Its language follows
            the `Accept-Language` header.
    Hierarchy:
      required:
      - code
      - name
      description: A named tree of org units.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The code. It is unique in the realm and never changes. Every
            realm has the hierarchy `default`.
        name:
          type: string
          maxLength: 255
    ImportAssignmentRow:
      type: object
      required:
      - externalId
      - employmentExternalId
      - orgUnitExternalId
      description: An assignment. It is matched by source and external ID.
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the assignment in that system.
        employmentExternalId:
          type: string
          description: The external ID of the employment with the same source.
        orgUnitExternalId:
          type: string
          description: The external ID of the org unit with the same source.
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        head:
          type: boolean
          description: True when the person leads the org unit.
          default: false
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
          default: false
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: The position among the members of the org unit.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        validFrom:
          type: string
          description: The first date of a new assignment. The default is the effective
            date. An existing assignment ignores it.
          format: date
        validTo:
          type: string
          description: The first date on which the assignment no longer holds. The
            default is the end of the employment.
          format: date
    ImportCounts:
      type: object
      required:
      - created
      - changed
      - unchanged
      description: The number of rows of one list by outcome.
      properties:
        created:
          type: integer
          format: int32
          description: Rows that made a new thing.
        changed:
          type: integer
          format: int32
          description: Rows that changed an existing thing.
        unchanged:
          type: integer
          format: int32
          description: Rows that matched what was stored.
    ImportDocument:
      required:
      - effectiveDate
      description: "The data of one import. The document describes the state from\
        \ the effective date. A new thing starts on that date, and a change to an\
        \ existing thing takes effect on that date."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date of the state.
          format: date
        dryRun:
          type: boolean
          description: True to do all checks and write nothing.
          default: false
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the rows come from. Rows can override
            it.
          default: import
        refItems:
          type: array
          items:
            $ref: "#/components/schemas/ImportRefItemRow"
        orgUnits:
          type: array
          items:
            $ref: "#/components/schemas/ImportOrgUnitRow"
        employments:
          type: array
          items:
            $ref: "#/components/schemas/ImportEmploymentRow"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ImportAssignmentRow"
    ImportEmploymentRow:
      type: object
      required:
      - externalId
      description: An employment. It is matched by source and external ID.
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the employment in that system.
        username:
          type: string
          description: The username of the Keycloak user. Either this or `userId`
            is required.
        userId:
          type: string
          description: The ID of the Keycloak user.
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person. It is
            used only when the employment is created.
        employmentType:
          type: string
          description: The code of the employment type.
        grade:
          type: string
          description: The code of the grade.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          default: ACTIVE
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
        attributes:
          type: object
          additionalProperties: {}
          description: Free values of the terms.
        validFrom:
          type: string
          description: The first date of a new employment. The default is the effective
            date. An existing employment ignores it.
          format: date
        validTo:
          type: string
          description: The first date on which the employment no longer holds.
          format: date
        endReason:
          type: string
          description: The code of the end reason. It is used only with `validTo`.
        employerExternalId:
          type: string
          description: "The external ID of the org unit that employs the person. It\
            \ is a legal entity. Leave it out when the realm has exactly one. A stored\
            \ employment keeps its employer, so the value must name that one."
    ImportOrgUnitRow:
      type: object
      required:
      - externalId
      - name
      description: An org unit. It is matched by source and external ID.
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the unit in that system.
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that is unique in the realm. It is used only when the
            unit is created.
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        shortName:
          type: string
          maxLength: 255
          description: The default short name.
        shortNames:
          type: object
          additionalProperties:
            type: string
          description: "The short names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        unitType:
          type: string
          description: The code of the unit type.
        parentExternalId:
          type: string
          description: The external ID of the parent with the same source. A root
            has none.
        displayOrder:
          type: integer
          format: int32
          description: The position among siblings.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        validFrom:
          type: string
          description: The first date of a new unit. The default is the effective
            date. An existing unit ignores it.
          format: date
        validTo:
          type: string
          description: The first date on which the unit no longer exists.
          format: date
    ImportRefItemRow:
      type: object
      required:
      - kind
      - code
      - name
      description: A reference item. It is matched by kind and code.
      properties:
        kind:
          $ref: "#/components/schemas/RefKind"
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        displayOrder:
          type: integer
          format: int32
          description: The position in lists.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        active:
          type: boolean
          description: False to stop the use of the item for new data.
          default: true
        legalEntity:
          type: boolean
          description: True for a unit type whose org units are legal entities. A
            row that leaves it out keeps the mark of a stored item.
    ImportReport:
      required:
      - dryRun
      - applied
      - counts
      - errors
      description: "What an import did, or would do."
      type: object
      properties:
        dryRun:
          type: boolean
          description: True when the request asked for a dry run.
        applied:
          type: boolean
          description: True when the rows were written. It is false for a dry run
            and when a row failed.
        counts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ImportCounts"
          description: The number of rows by outcome for each list of the document.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
          description: "The rows that could not be applied. When this is not empty,\
            \ nothing was written."
    ImportRowError:
      type: object
      required:
      - list
      - row
      - error
      - message
      description: A row that could not be applied.
      properties:
        list:
          type: string
          description: The name of the list in the document.
        row:
          type: integer
          format: int32
          description: "The position of the row in its list, counted from 0."
        line:
          type: integer
          format: int32
          description: "The line number in the CSV file, counted from 1. Only a CSV\
            \ import has it."
        error:
          type: string
          description: The stable error code.
        params:
          type: object
          additionalProperties:
            type: string
          description: The values that the message refers to.
        message:
          type: string
          description: The message for people.
    Leave:
      required:
      - validFrom
      description: A request to put a person on leave.
      type: object
      properties:
        validFrom:
          type: string
          description: The first date of the leave.
          format: date
        validTo:
          type: string
          description: The first date back at work. Leave it out when it is not known
            yet. On that date the status of before the leave comes back.
          format: date
    Mask:
      required:
      - personId
      - maskedAt
      - keycloakNameCleared
      description: The result of a masking.
      type: object
      properties:
        personId:
          type: string
        userId:
          type: string
          description: The ID of the Keycloak user that the person is linked to.
        maskedAt:
          type: string
          description: "When the data was first masked, in UTC."
          format: date-time
        keycloakNameCleared:
          type: boolean
          description: True when this request emptied the name of the linked Keycloak
            user.
    Member:
      required:
      - assignmentId
      - employmentId
      - personId
      - seconded
      - orgUnitId
      - orgUnitName
      - validFrom
      - head
      - primary
      - displayOrder
      - status
      description: One assignment of one person on one date.
      type: object
      properties:
        assignmentId:
          type: string
        employmentId:
          type: string
        personId:
          type: string
          description: The ID of the person.
        userId:
          type: string
          description: The ID of the Keycloak user that the person is linked to.
        employerId:
          type: string
          description: The ID of the org unit that employs the person.
        seconded:
          type: boolean
          description: True when the person works outside the employer. The org unit
            is then not the employer and not below it in the default hierarchy.
        staffNumber:
          type: string
          description: The number that the legal entity gives to the person.
        orgUnitId:
          type: string
        orgUnitName:
          type: string
          description: The name of the org unit on the date.
        orgUnitPath:
          type: array
          items:
            $ref: "#/components/schemas/PathEntry"
          description: The units from the root down to the org unit. Only present
            when asked for.
        validFrom:
          type: string
          description: The first date of these details of the assignment.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        head:
          type: boolean
          description: True when the person leads the org unit.
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: "The position among the members of the org unit, lowest first."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        employmentType:
          type: string
          description: The code of the employment type on the date.
        grade:
          type: string
          description: The code of the grade on the date.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work on the date in percent.
    Move:
      required:
      - orgUnitId
      - validFrom
      description: "A request to move a person to another org unit on a date, and\
        \ its response."
      type: object
      properties:
        orgUnitId:
          type: string
          description: The ID of the org unit where the person works from the date.
          writeOnly: true
        validFrom:
          type: string
          description: The first date in the new org unit.
          format: date
          writeOnly: true
        jobTitle:
          type: string
          description: The code of the job title in the new org unit. Leave it out
            to keep the job title.
          writeOnly: true
        head:
          type: boolean
          description: True when the person leads the new org unit. The flag of the
            old org unit is not kept.
          writeOnly: true
          default: false
        displayOrder:
          type: integer
          format: int32
          description: The position among the members of the new org unit.
          writeOnly: true
          default: 0
        ended:
          description: "The assignment to the old org unit, with its end."
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
        started:
          description: The assignment to the new org unit.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
    MovedEmployment:
      type: object
      required:
      - personId
      - endedEmploymentId
      - startedEmploymentId
      description: One person who moved to the new employer.
      properties:
        personId:
          type: string
        endedEmploymentId:
          type: string
          description: The ID of the employment at the old employer.
        startedEmploymentId:
          type: string
          description: The ID of the employment at the new employer.
    OrgUnit:
      type: object
      required:
      - name
      - validFrom
      description: An org unit as it is on one date.
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that is unique in the realm.
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        shortName:
          type: string
          maxLength: 255
          description: The default short name.
        shortNames:
          type: object
          additionalProperties:
            type: string
          description: "The short names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        unitType:
          type: string
          description: The code of the unit type.
        legalEntity:
          type: boolean
          description: "True when the unit type marks the unit as a legal entity,\
            \ such as a company."
          readOnly: true
        parentId:
          type: string
          description: The ID of the parent in the default hierarchy. A root has none.
        validFrom:
          type: string
          description: The first date of these details.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
          readOnly: true
        displayOrder:
          type: integer
          format: int32
          description: "The position among siblings, lowest first."
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          description: The ID of the unit in the system it came from.
        source:
          type: string
          description: The name of that system.
        keycloakOrganizationId:
          type: string
          description: The ID of the linked Keycloak organization.
          readOnly: true
        timeZone:
          type: string
          description: The time zone that the unit sets for itself and the units below
            it.
          readOnly: true
        dayStart:
          type: string
          description: The day start that the unit sets for itself and the units below
            it.
          readOnly: true
    OrgUnitHistory:
      required:
      - id
      - versions
      - parents
      description: Everything that is stored about an org unit over time.
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        externalId:
          type: string
          description: The ID of the unit in the system it came from.
        source:
          type: string
          description: The name of that system.
        versions:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnit"
          description: "The details of each period, oldest first. They have no parent."
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ParentPeriod"
          description: "The parents in every hierarchy, oldest first. A gap in a hierarchy\
            \ means that the unit had no parent there."
    OrganizationLink:
      description: The link of an org unit to a Keycloak organization.
      type: object
      properties:
        orgUnitId:
          type: string
          readOnly: true
        organizationId:
          type: string
          description: The ID of the Keycloak organization. A request to link needs
            it. A response has none after the link was removed.
    ParentChange:
      required:
      - validFrom
      type: object
      properties:
        parentId:
          type: string
          description: The ID of the new parent. Leave it out to make the unit a root.
        validFrom:
          type: string
          description: The first date under the new parent.
          format: date
    ParentPeriod:
      type: object
      required:
      - hierarchy
      - parentId
      - validFrom
      description: The parent of an org unit for a period.
      properties:
        hierarchy:
          type: string
          description: The code of the hierarchy that the parent belongs to.
        parentId:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          description: The first date after the period. It is missing for no end.
          format: date
    PathEntry:
      type: object
      required:
      - id
      - name
      description: One org unit on the way from the root.
      properties:
        id:
          type: string
        name:
          type: string
          description: The name of the org unit on the date.
    Person:
      description: A person that the realm knows. A person does not need a Keycloak
        user.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        userId:
          type: string
          description: The ID of the linked Keycloak user. One user is linked to at
            most one person.
        name:
          type: string
          maxLength: 255
          description: "The default name. A person with no linked user needs it. When\
            \ the record has no name, a response has the name of the linked user from\
            \ Keycloak."
        nameSource:
          type: string
          description: Where the name of a response came from. `RECORD` is the person
            record. `KEYCLOAK` is the linked user. It is missing when there is no
            name.
          readOnly: true
          enum:
          - RECORD
          - KEYCLOAK
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          description: The ID of the person in the system it came from. Only a create
            request reads it.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of that system. Only a create request reads it.
    ProjectionReport:
      required:
      - organizations
      - groupsCreated
      - groupsRenamed
      - groupsMoved
      - groupsRemoved
      - membersJoined
      - membersLeft
      - organizationMembersAdded
      description: What a rebuild of the projection changed in Keycloak.
      type: object
      properties:
        organizations:
          type: integer
          format: int32
          description: The number of linked organizations that were projected.
        groupsCreated:
          type: integer
          format: int32
          description: The number of groups that were created.
        groupsRenamed:
          type: integer
          format: int32
          description: The number of groups that got a new name.
        groupsMoved:
          type: integer
          format: int32
          description: The number of groups that got a new parent.
        groupsRemoved:
          type: integer
          format: int32
          description: The number of groups that were removed.
        membersJoined:
          type: integer
          format: int32
          description: The number of group memberships that were added.
        membersLeft:
          type: integer
          format: int32
          description: The number of group memberships that were removed.
        organizationMembersAdded:
          type: integer
          format: int32
          description: The number of users who became members of an organization.
    Promotion:
      required:
      - validFrom
      description: "A request to promote a person on a date, and its response. The\
        \ request names a grade, a job title, or a head flag, or several of them."
      type: object
      properties:
        validFrom:
          type: string
          description: The first date of the new values.
          format: date
          writeOnly: true
        grade:
          type: string
          description: The code of the new grade. Leave it out to keep the grade.
          writeOnly: true
        jobTitle:
          type: string
          description: The code of the new job title. Leave it out to keep the job
            title.
          writeOnly: true
        assignmentId:
          type: string
          description: The ID of the assignment that gets the job title and the head
            flag. The default is the primary assignment of the employment on the date.
          writeOnly: true
        head:
          type: boolean
          description: Whether the person leads the org unit from the date. Leave
            it out to keep the flag.
          writeOnly: true
        employment:
          description: The employment with all its terms.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        assignment:
          description: The assignment with all its details. It is absent when the
            request named no job title and no head flag.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
    Qualification:
      required:
      - kind
      - validFrom
      type: object
      properties:
        id:
          type: string
          readOnly: true
        personId:
          type: string
          description: The ID of the person. Only a request to add reads it.
        userId:
          type: string
          description: "The ID of the Keycloak user that the person is linked to.\
            \ A request to add can give it in place of `personId`. The person of the\
            \ user is then used, and created when the user has none."
        kind:
          type: string
          description: The code of the qualification kind.
        number:
          type: string
          maxLength: 255
          description: The number of the license or certificate.
        validFrom:
          type: string
          description: The first date on which the qualification is valid.
          format: date
        validTo:
          type: string
          description: The first date on which it is no longer valid. It is missing
            for no end.
          format: date
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          description: The ID of the qualification in the system it came from.
        source:
          type: string
          description: The name of that system.
    RefItem:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          readOnly: true
        kind:
          $ref: "#/components/schemas/RefKind"
          description: Only a create request reads it.
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: Only a create request reads it.
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        displayOrder:
          type: integer
          format: int32
          description: "The position in lists, lowest first."
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        active:
          type: boolean
          description: False when the item must not be used for new data.
        legalEntity:
          type: boolean
          description: "True for a unit type whose org units are legal entities, such\
            \ as a company. Only the kind `UNIT_TYPE` can have it."
          default: false
    RefKind:
      type: string
      enum:
      - UNIT_TYPE
      - JOB_TITLE
      - OCCUPATION
      - EMPLOYMENT_TYPE
      - GRADE
      - END_REASON
      - ASSIGNMENT_KIND
      - QUALIFICATION
      description: The kinds of reference items. Each realm defines its own items
        for each kind.
    Reorganization:
      required:
      - effectiveDate
      - steps
      description: "A request to change many org units on one date, and its response."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date of every step.
          format: date
          writeOnly: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReorganizationStep"
          description: "The steps, in the order to apply them."
          writeOnly: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReorganizationResult"
          description: "What each step did, in the same order."
          readOnly: true
    ReorganizationResult:
      type: object
      required:
      - op
      - unit
      description: What one step did.
      properties:
        op:
          type: string
          enum:
          - create
          - change
          - move
          - end
        unit:
          description: "The unit after the step. For an end, it is the unit on its\
            \ last date."
          type: object
          $ref: "#/components/schemas/OrgUnit"
    ReorganizationStep:
      type: object
      required:
      - op
      description: One operation of a reorganization.
      properties:
        op:
          type: string
          enum:
          - create
          - change
          - move
          - end
        ref:
          type: string
          description: A name that later steps of the same request can use for the
            unit that a create step makes.
        id:
          type: string
          description: "The ID of the unit to change, move, or end."
        unitRef:
          type: string
          description: "The `ref` of an earlier create step, in place of `id`."
        parentId:
          type: string
          description: The ID of the parent for a create or a move.
        parentRef:
          type: string
          description: "The `ref` of an earlier create step, in place of `parentId`."
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The code of a new unit.
        name:
          type: string
          maxLength: 255
          description: "The default name, for a create or a change."
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        shortName:
          type: string
          maxLength: 255
          description: The default short name.
        shortNames:
          type: object
          additionalProperties:
            type: string
          description: "The short names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        unitType:
          type: string
          description: The code of the unit type.
        displayOrder:
          type: integer
          format: int32
          description: The position among siblings.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    Reporting:
      required:
      - personId
      - kind
      - derived
      - assignmentId
      - orgUnitId
      description: "One manager of a person, or one direct report of a person, on\
        \ a date."
      type: object
      properties:
        personId:
          type: string
          description: "The ID of the other person. It is the manager in a list of\
            \ managers, and the report in a list of reports."
        userId:
          type: string
          description: The ID of the Keycloak user that the other person is linked
            to.
        kind:
          $ref: "#/components/schemas/ReportingKind"
        derived:
          type: boolean
          description: True when no reporting line is stored and the head of the org
            unit is taken as the manager.
        lineId:
          type: string
          description: The ID of the stored reporting line. A derived entry has none.
        assignmentId:
          type: string
          description: The ID of the assignment of the person who reports.
        orgUnitId:
          type: string
          description: The ID of the org unit of that assignment.
    ReportingKind:
      type: string
      enum:
      - SOLID
      - DOTTED
      description: |
        `SOLID` is the main manager. An assignment has at most one at a time.
        `DOTTED` is a further manager, for example of a project.
    ReportingLine:
      required:
      - assignmentId
      - validFrom
      type: object
      properties:
        id:
          type: string
          readOnly: true
        assignmentId:
          type: string
          description: The ID of the assignment of the person who reports.
        managerPersonId:
          type: string
          description: The ID of the person who is the manager.
        managerUserId:
          type: string
          description: "The ID of the Keycloak user that the manager is linked to.\
            \ A request can give it in place of `managerPersonId`. The person of the\
            \ user is then used, and created when the user has none."
        kind:
          $ref: "#/components/schemas/ReportingKind"
          default: SOLID
        validFrom:
          type: string
          description: The first date of the line.
          format: date
        validTo:
          type: string
          description: The first date after the line. Leave it out to last as long
            as the assignment.
          format: date
    Return:
      required:
      - validFrom
      description: A request to end the leave of a person.
      type: object
      properties:
        validFrom:
          type: string
          description: The first date back at work.
          format: date
    Staff:
      required:
      - orgUnitId
      - validFrom
      description: "A request to add a person to an org unit in one call, and its\
        \ response. The request starts an employment and adds its first assignment."
      type: object
      properties:
        personId:
          type: string
          description: The ID of the person.
          writeOnly: true
        userId:
          type: string
          description: "The ID of the Keycloak user, in place of `personId`. The person\
            \ of the user is used, and created when the user has none."
          writeOnly: true
        employerId:
          type: string
          description: The ID of the org unit that employs the person. Leave it out
            when the realm has exactly one legal entity.
          writeOnly: true
        orgUnitId:
          type: string
          writeOnly: true
        validFrom:
          type: string
          description: The first date of the employment and of the assignment.
          format: date
          writeOnly: true
        validTo:
          type: string
          description: The first date after both.
          format: date
          writeOnly: true
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person.
          writeOnly: true
        employmentType:
          type: string
          description: The code of the employment type.
          writeOnly: true
        grade:
          type: string
          description: The code of the grade.
          writeOnly: true
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
          writeOnly: true
        jobTitle:
          type: string
          description: The code of the job title.
          writeOnly: true
        occupation:
          type: string
          description: The code of the occupation.
          writeOnly: true
        head:
          type: boolean
          description: True when the person leads the org unit.
          writeOnly: true
          default: false
        primary:
          type: boolean
          description: False when this is not the main assignment.
          writeOnly: true
          default: true
        employment:
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        assignment:
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
    SyncReport:
      required:
      - dryRun
      - users
      - employmentsStarted
      - assignmentsAdded
      - assignmentsMoved
      - assignmentsChanged
      - assignmentsEnded
      - reportingLinesChanged
      - unmatched
      description: "What a sync from user attributes did, or would do."
      type: object
      properties:
        dryRun:
          type: boolean
          description: True when the request asked for a dry run.
        users:
          type: integer
          format: int32
          description: The number of users with a department.
        employmentsStarted:
          type: integer
          format: int32
          description: The number of employments that were started.
        assignmentsAdded:
          type: integer
          format: int32
          description: The number of assignments that were added.
        assignmentsMoved:
          type: integer
          format: int32
          description: The number of users whose assignment moved to another org unit.
        assignmentsChanged:
          type: integer
          format: int32
          description: The number of assignments that got a new job title.
        assignmentsEnded:
          type: integer
          format: int32
          description: The number of assignments that ended because the department
            was removed.
        reportingLinesChanged:
          type: integer
          format: int32
          description: The number of users whose reporting line changed.
        unmatched:
          type: array
          items:
            $ref: "#/components/schemas/SyncUnmatched"
          description: The values of user attributes that matched nothing.
    SyncUnmatched:
      type: object
      required:
      - userId
      - field
      - value
      - reason
      description: A value of a user attribute that matched nothing.
      properties:
        userId:
          type: string
        field:
          type: string
          enum:
          - department
          - title
          - manager
        value:
          type: string
        reason:
          type: string
          description: '`unknown` when nothing has the value. `ambiguous` when more
            than one org unit has the name.'
          enum:
          - unknown
          - ambiguous
    TimeSettings:
      description: "The time settings of an org unit. They also hold for the units\
        \ below it, unless one of them has its own."
      type: object
      properties:
        orgUnitId:
          type: string
          readOnly: true
        timeZone:
          type: string
          description: The time zone. Leave it out to use the one from above.
          examples:
          - America/New_York
        dayStart:
          type: string
          description: "The time of day when the date changes, as `HH:mm`. Leave it\
            \ out to use the one from above."
          examples:
          - 05:00
    Transfer:
      required:
      - employerId
      - validFrom
      description: "A request to move a person to another employer on a date, and\
        \ its response."
      type: object
      properties:
        employerId:
          type: string
          description: "The ID of the org unit that employs the person from the date.\
            \ It is a legal entity on that date, and not the employer of today."
          writeOnly: true
        validFrom:
          type: string
          description: The first date at the new employer.
          format: date
          writeOnly: true
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the new employer gives to the person.
          writeOnly: true
        endReason:
          type: string
          description: The code of the end reason of the old employment.
          writeOnly: true
        ended:
          description: "The employment at the old employer, with its end."
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        started:
          description: The employment at the new employer.
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
          description: The assignments that the new employment got.
          readOnly: true
        reportingLines:
          type: array
          items:
            $ref: "#/components/schemas/ReportingLine"
          description: The reporting lines that the new assignments got.
          readOnly: true
    Transfers:
      required:
      - fromEmployerId
      - toEmployerId
      - validFrom
      description: "A request to move every person of one employer to another employer\
        \ on a date, and its response. It is for a merger of two legal entities."
      type: object
      properties:
        fromEmployerId:
          type: string
          description: The ID of the org unit that employs the people today.
          writeOnly: true
        toEmployerId:
          type: string
          description: The ID of the org unit that employs them from the date. It
            is a legal entity on that date.
          writeOnly: true
        validFrom:
          type: string
          description: The first date at the new employer.
          format: date
          writeOnly: true
        endReason:
          type: string
          description: The code of the end reason of the old employments.
          writeOnly: true
        keepStaffNumbers:
          type: boolean
          description: True to keep the staff number of each person. A number that
            the new employer has given to another person rejects the request.
          writeOnly: true
          default: false
        staffNumbers:
          type: object
          additionalProperties:
            type: string
          description: "New staff numbers, by the ID of the old employment. They win\
            \ over `keepStaffNumbers`."
          writeOnly: true
        endEmployer:
          type: boolean
          description: "True to also end the old employer on the date. The request\
            \ is rejected when an employment, a child org unit, or an assignment would\
            \ still be there."
          writeOnly: true
          default: false
        transferred:
          type: integer
          format: int32
          description: The number of people who moved.
          readOnly: true
        employments:
          type: array
          items:
            $ref: "#/components/schemas/MovedEmployment"
          description: The old and the new employment of each person.
          readOnly: true
        endedEmployer:
          description: "The old employer with its end, when the request asked for\
            \ it."
          readOnly: true
          type: object
          $ref: "#/components/schemas/OrgUnit"
    UserHistory:
      required:
      - employments
      - assignments
      description: Everything that is stored about one person over time.
      type: object
      properties:
        personId:
          type: string
          description: The ID of the person. A user with no person has none.
        userId:
          type: string
          description: The ID of the Keycloak user that the person is linked to.
        maskedAt:
          type: string
          description: "When the personal data of the person was masked, in UTC. It\
            \ is missing when it never was."
          format: date-time
        employments:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
          description: "The employments with their terms, oldest first."
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
          description: "The assignments with their details, oldest first."
    Version:
      required:
      - version
      type: object
      properties:
        version:
          type: string
  parameters:
    changeOrder:
      description: |
        The ID of the change order that the write belongs to.
        A request that names an unknown change order gets 400 and writes nothing.
      in: query
      name: changeOrder
      schema:
        type: string
  responses:
    BadRequest:
      description: A value in the request is bad.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The request conflicts with existing data.
        A realm with no usable time zone also gets this status on every request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the permission.
    ImportFailed:
      description: |
        A row failed, and the body is the report with every bad row.
        Or the request itself is bad, and the body is an error.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: "#/components/schemas/ImportReport"
            - $ref: "#/components/schemas/Error"
    NotFound:
      description: The target does not exist in the realm.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request has no valid token.
  securitySchemes:
    bearer:
      type: http
      description: An access token for the admin API of Keycloak.
      scheme: bearer
      bearerFormat: JWT
info:
  description: |
    The API has no release yet and can still change.

    Dates have the form `YYYY-MM-DD`.
    A period includes its `validFrom` date and does not include its `validTo` date.

    A response leaves out every field that has no value.
    For example, an org unit with no end date has no `validTo` field.

    A read needs the permission to view users. A write needs the permission to manage users.

    A write belongs to a change order when its request has the query parameter `changeOrder`.

    A failed request writes nothing.
  license:
    identifier: Apache-2.0
    name: "Apache License, Version 2.0"
  summary: Organization structure and its history for each Keycloak realm.
  title: keycloak-fuhito admin REST API
  version: 0.1.0
servers:
- url: "{baseUrl}/admin/realms/{realm}/fuhito"
  variables:
    baseUrl:
      description: The base URL of Keycloak.
      default: http://localhost:8080
    realm:
      description: The name of the realm.
      default: master
security:
- bearer: []
externalDocs:
  description: How the extension plugs into Keycloak
  url: https://github.com/exoego/keycloak-fuhito/blob/main/docs/keycloak-integration.md
paths:
  /:
    get:
      summary: Returns the version of this extension.
      operationId: getVersion
      tags:
      - general
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments:
    post:
      summary: Adds an assignment of an employment to an org unit.
      operationId: addAssignment
      tags:
      - assignments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignment"
        required: true
      responses:
        "201":
          description: The new assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments/{id}:
    get:
      summary: Returns an assignment with the details of every period.
      operationId: getAssignment
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments/{id}/details:
    put:
      summary: Replaces the details of an assignment from the `validFrom` date of
        the body.
      description: The employment and the org unit do not change.
      operationId: changeAssignmentDetails
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentDetails"
        required: true
      responses:
        "200":
          description: The assignment with the details of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments/{id}/end:
    delete:
      summary: Removes the end of an assignment.
      description: The assignment then lasts as long as its employment.
      operationId: removeAssignmentEnd
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "200":
          description: The assignment with the details of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      summary: Sets the end of an assignment.
      description: Its history stays readable. The end can move earlier or later.
      operationId: endAssignment
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/End"
        required: true
      responses:
        "200":
          description: The assignment with the details of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments/{id}/move:
    post:
      summary: "Moves a person to another org unit on a date, in one write."
      description: "The assignment ends on the date. A new assignment of the same\
        \ employment to the new org unit starts on the same date, and names the old\
        \ one in `continuesAssignmentId`. It keeps the occupation, the kind, the primary\
        \ flag, the allocation, and the attributes. It keeps the job title unless\
        \ the request gives one. The head flag and the display order belong to the\
        \ old org unit and are not kept. The reporting lines of the old assignment\
        \ end with it. A failure writes nothing."
      operationId: moveAssignment
      tags:
      - assignments
      parameters:
      - description: The ID of the assignment to the old org unit.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Move"
        required: true
      responses:
        "201":
          description: The two assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Move"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /attribute-sync/run:
    post:
      summary: Makes the assignments and reporting lines of the sync match the user
        attributes of now.
      description: "Running it again with no change in between changes nothing. The\
        \ run works in pieces of users. When it fails in the middle, the pieces before\
        \ the failure stay, and the next run does the rest."
      operationId: runAttributeSync
      tags:
      - keycloak
      parameters:
      - description: True to report what the sync would do and write nothing.
        schema:
          type: boolean
          default: false
        name: dryRun
        in: query
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "200":
          description: What the run did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /change-log:
    get:
      summary: "Lists the writes to the realm, oldest first."
      description: "To follow the changes, keep the `sequence` of the last entry of\
        \ each read and pass it as `after` in the next read. A read that returns fewer\
        \ entries than `max` has reached the end. The numbers of a realm start at\
        \ 1 and have no gaps, except where an erase of the data of a person removed\
        \ entries."
      operationId: listChangeLog
      tags:
      - change-orders
      parameters:
      - description: The sequence number that the entries come after.
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
        name: after
        in: query
      - description: The number of entries to skip.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: "The ID of the resource. Without it, the writes to every resource\
          \ are listed."
        name: resourceId
        in: query
        schema:
          type: string
      - description: "The type of the resource. Without it, the writes to every type\
          \ are listed."
        schema:
          type: string
          examples:
          - FUHITO_ORG_UNIT
        name: resourceType
        in: query
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /change-orders:
    get:
      summary: "Lists the change orders with an effective date in a range, newest\
        \ effective date first."
      operationId: listChangeOrders
      tags:
      - change-orders
      parameters:
      - description: The number of entries to skip.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The first effective date to return.
        schema:
          type: string
          format: date
        name: from
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: The first effective date not to return.
        schema:
          type: string
          format: date
        name: to
        in: query
      responses:
        "200":
          description: The orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      summary: Creates a change order.
      operationId: createChangeOrder
      tags:
      - change-orders
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrder"
        required: true
      responses:
        "201":
          description: The new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /change-orders/{id}:
    put:
      summary: Replaces the values of a change order.
      operationId: updateChangeOrder
      tags:
      - change-orders
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOrder"
        required: true
      responses:
        "200":
          description: The changed order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      summary: Returns one change order.
      operationId: getChangeOrder
      tags:
      - change-orders
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Deletes a change order.
      description: A change order with writes cannot be deleted.
      operationId: deleteChangeOrder
      tags:
      - change-orders
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "204":
          description: The order was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /change-orders/{id}/announce:
    post:
      summary: Records that a change order was announced.
      description: "It sets `announcedAt` to now and `announcedByUserId` to the caller.\
        \ It cannot be taken back, and no request can set a time in the future. An\
        \ application that announces on a set day calls this on that day."
      operationId: announceChangeOrder
      tags:
      - change-orders
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "200":
          description: The changed order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /change-orders/{id}/changes:
    get:
      summary: "Lists the writes that belong to a change order, oldest first."
      operationId: listChangeOrderChanges
      tags:
      - change-orders
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: The number of entries to skip.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeLogEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /effective-changes:
    get:
      summary: Lists the resources with a period that starts or ends in a range of
        dates.
      description: "A change with a future date is in the change log on the day it\
        \ is stored. This read tells when it takes effect. An entry says that something\
        \ about the resource starts, changes, or ends on the date. Read the resource\
        \ with `asOf` to see what. The entries come from the rows as they are now,\
        \ so a change that was removed before its date is not listed. The order is\
        \ the date, then the type, then the ID."
      operationId: listEffectiveChanges
      tags:
      - change-orders
      parameters:
      - description: The number of entries to skip.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The first date of the range. The default is today in the time
          zone of the realm.
        schema:
          type: string
          format: date
        name: from
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: The first date after the range. The default is the day after
          `from`.
        schema:
          type: string
          format: date
        name: to
        in: query
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EffectiveChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments:
    post:
      summary: Starts an employment of a user.
      operationId: startEmployment
      tags:
      - employments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Employment"
        required: true
      responses:
        "201":
          description: The new employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/transfers:
    post:
      summary: "Moves every person of one employer to another employer on a date,\
        \ in one write."
      description: "It is for a merger of two legal entities. Each employment that\
        \ holds on the day before and on the date is transferred, as `POST /employments/{id}/transfer`\
        \ does for one. With `endEmployer`, the old employer ends on the same date.\
        \ A failure writes nothing."
      operationId: transferEmployments
      tags:
      - employments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Transfers"
        required: true
      responses:
        "201":
          description: The old and the new employment of each person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}:
    get:
      summary: Returns an employment with the terms of every period.
      operationId: getEmployment
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}/end:
    delete:
      summary: "Removes the end of an employment, for example to take back a resignation."
      operationId: removeEmploymentEnd
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "200":
          description: The employment with the terms of every period.
          content:
            application/json:
              schema:
