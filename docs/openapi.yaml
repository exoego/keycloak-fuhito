  /imports:
    post:
      summary: Loads many rows in one transaction.
      description: "All rows are written, or none. A dry run does all checks and writes\
        \ nothing. The lists are applied in the order change orders, kinds of reference\
        \ data, definitions of attributes, reference items, hierarchies, org units,\
