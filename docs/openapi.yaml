      summary: "Lists the items of a kind, ordered by display order and then by code."
      description: Each item has the names of the date. A date before the first names
        of an item gets its first names.
      operationId: listRefItems
      tags:
      - ref-items
      parameters:
      - description: The date of the names. The default is today in the time zone
          of the realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: The number of entries to skip.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: True to also return inactive items.
        schema:
          type: boolean
          default: false
        name: includeInactive
        in: query
      - description: "A fixed kind such as `UNIT_TYPE`, or the code of a kind that\
          \ the realm added."
        required: true
        name: kind
        in: query
        schema:
          type: string
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RefItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      summary: Creates an item.
      description: "The body needs `kind`, `code`, `primaryLanguage`, and `names`.\
        \ With `validFrom`, the names hold from that date. Without it, they hold for\
        \ every date."
      operationId: createRefItem
      tags:
      - ref-items
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefItem"
        required: true
      responses:
        "201":
          description: The new item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /ref-items/count:
    get:
      summary: Counts the items that `GET /ref-items` lists with the same filters.
      description: "Every item has names on every date, so the count is the same for\
        \ every date."
      operationId: countRefItems
      tags:
      - ref-items
      parameters:
      - description: True to also count inactive items.
        schema:
          type: boolean
          default: false
        name: includeInactive
        in: query
      - description: "A fixed kind such as `UNIT_TYPE`, or the code of a kind that\
          \ the realm added."
        required: true
        name: kind
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The number of items on all pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /ref-items/{id}:
    put:
      summary: Replaces the changeable values of an item.
      description: "The kind and the code never change. The body can leave them out.\
        \ Only the names have dates. With `validFrom`, the new names hold from that\
        \ date until the next stored names, and the old names stay for the dates before.\
        \ A date that starts stored names corrects them. Without `validFrom`, the\
        \ write changes the names of today. The response has the names of that date."
      operationId: updateRefItem
      tags:
      - ref-items
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/RefItem"
              - $ref: "#/components/schemas/VersionCheck"
        required: true
      responses:
        "200":
          description: The changed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      summary: Returns one item with the names of a date.
      operationId: getRefItem
      tags:
      - ref-items
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: The date of the names. The default is today in the time zone
          of the realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Deletes an item.
      operationId: deleteRefItem
      tags:
      - ref-items
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: The version of the item that the caller read.
        required: true
        schema:
          format: int64
          type: integer
        name: version
        in: query
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "204":
          description: The item was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /ref-items/{id}/history:
    get:
      summary: Returns every period of the names of an item.
      description: A caller who may read only the structure gets 403 when the realm
        attribute `fuhito.structure.daysAhead` limits how far ahead the caller may
        read.
      operationId: getRefItemHistory
      tags:
      - ref-items
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The names of every period, oldest first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefItemHistory"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /ref-kinds:
    get:
      summary: "Lists the kinds of reference data, the fixed ones first, then the\
        \ ones of the realm."
      operationId: listRefKinds
      tags:
      - ref-items
      responses:
        "200":
          description: The kinds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RefKindDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      summary: "Adds a kind of reference data to the realm, such as a working time\
        \ system or a collective agreement."
      description: "The body needs `code`, `primaryLanguage`, and `names`. Its items\
        \ are reference items with the code as their kind. Attributes of the type\
        \ `REF_ITEM` can point to it."
      operationId: createRefKind
      tags:
      - ref-items
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefKindDefinition"
        required: true
      responses:
        "201":
          description: The new kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefKindDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /ref-kinds/{code}:
    put:
      summary: Changes the names of a kind of the realm.
      description: The code never changes. The body can leave it out.
      operationId: renameRefKind
      tags:
      - ref-items
      parameters:
      - description: The code of the kind.
        name: code
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/RefKindDefinition"
              - $ref: "#/components/schemas/VersionCheck"
        required: true
      responses:
        "200":
          description: The changed kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefKindDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Removes a kind of the realm that has no items.
      operationId: deleteRefKind
      tags:
      - ref-items
      parameters:
      - description: The code of the kind.
        name: code
        in: path
        required: true
        schema:
          type: string
      - description: The version of the kind that the caller read.
        required: true
        schema:
          format: int64
          type: integer
        name: version
        in: query
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "204":
          description: The kind is gone.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /reorganizations:
    post:
      summary: "Changes many org units on one date, in one transaction."
      description: "A failed step writes nothing. A step that changes a stored unit\
        \ names the `version` of the unit that the caller read. An old version fails\
        \ with 409 and `version.conflict`, and `step` in the values of the error."
      operationId: applyReorganization
      tags:
      - org-units
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reorganization"
        required: true
      responses:
        "200":
          description: What each step did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reorganization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /reporting-lines:
    post:
      summary: Adds a reporting line from an assignment to a manager.
      operationId: addReportingLine
      tags:
      - reporting-lines
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportingLine"
        required: true
      responses:
        "201":
          description: The new line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /reporting-lines/{id}:
    get:
      summary: Returns one reporting line.
      operationId: getReportingLine
      tags:
      - reporting-lines
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingLine"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Deletes a reporting line, as if it had never been stored."
      operationId: deleteReportingLine
      tags:
      - reporting-lines
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: The version of the line that the caller read.
        required: true
        schema:
          format: int64
          type: integer
        name: version
        in: query
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "204":
          description: The line was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /reporting-lines/{id}/end:
    put:
      summary: Ends a reporting line earlier.
      operationId: endReportingLine
      tags:
      - reporting-lines
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/End"
        required: true
      responses:
        "200":
          description: The changed line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /restore:
    post:
      summary: "Loads an export into a realm that has no data of the extension, or\
        \ in place of its data."
      description: "Every row keeps its ID, so products that stored IDs find the same\
        \ resources. The rows are written all or nothing. A username must name a user\
        \ of this realm. An org unit names its Keycloak organization by alias, and\
        \ the restore asks for the permission to manage it."
      operationId: restore
      tags:
      - bulk
      parameters:
      - description: "True to delete every row of the extension in the realm first,\
          \ for data that was removed or changed by mistake. The change log stays.\
          \ Without it, a realm with data is refused."
        schema:
          type: boolean
          default: false
        name: replace
        in: query
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealmExport"
        required: true
      responses:
        "200":
          description: The number of rows of each list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /staff:
    post:
      summary: Starts an employment and adds its first assignment in one call.
      description: "It is for a new person, and also for a person who left and comes\
        \ back. The old employment of that person stays as it is. The new one can\
        \ have the same staff number."
      operationId: addStaff
      tags:
      - assignments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Staff"
        required: true
      responses:
        "201":
          description: The new employment and the new assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /unit-roles:
    get:
      summary: "Lists the roles over org units of a date across the realm, ordered\
        \ by ID."
      description: "To read every role, follow the `Link` header of each response.\
        \ `orgUnitId` keeps the roles over that unit only. The roles over a unit above\
        \ that cover it are in `GET /org-units/{id}/role-holders`. They name people,\
        \ so the read needs the full read permission."
      operationId: listUnitRoles
      tags:
      - unit-roles
      parameters:
      - description: The cursor from the `Link` header of the page before.
        name: after
        in: query
        schema:
          type: string
      - description: The date to read. The default is today in the time zone of the
          realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: The number of entries to skip. It cannot be used with `after`.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: The ID of an org unit to keep. The units above do not count.
        name: orgUnitId
        in: query
        schema:
          type: string
      - description: The code of a role to keep.
        name: role
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The roles of the date.
          headers:
            Link:
              description: "The URL of the next page, with `rel=\"next\"`. It is there\
                \ when the page is full. A full page can be the last one, and the\
                \ next page is then empty."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleHolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      summary: Gives an employment a role over an org unit.
      description: "The role is not membership. The end of the employment ends the\
        \ role, and a transfer to another employer carries it."
      operationId: addUnitRole
      tags:
      - unit-roles
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitRole"
        required: true
      responses:
        "201":
          description: The new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitRole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
