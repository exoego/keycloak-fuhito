---
tags:
- name: general
  summary: General
  kind: nav
  description: The version and the hierarchies.
- name: ref-items
  summary: Reference items
  kind: nav
  description: "The lists that a realm defines, such as unit types and occupations."
- name: org-units
  summary: Org units
  kind: nav
  description: "Org units, their tree on a date, and their history."
- name: employments
  summary: Employments
  kind: nav
  description: "Employments of users, with their terms over time."
- name: assignments
  summary: Assignments
  kind: nav
  description: Assignments of employments to org units.
- name: reporting-lines
  summary: Reporting lines
  kind: nav
  description: Links from an assignment to a manager.
- name: qualifications
  summary: Qualifications
  kind: nav
  description: Licenses and certificates of users.
- name: people
  summary: People
  kind: nav
  description: "The people that the realm knows, with or without a Keycloak user."
- name: users
  summary: Users
  kind: nav
  description: What is stored about one user.
- name: change-orders
  summary: Change orders and change log
  kind: nav
  description: "Approved instructions that cause changes, and the log of every write."
- name: bulk
  summary: Import and export
  kind: nav
  description: "Many rows in one request, and all data of the realm."
- name: keycloak
  summary: Keycloak sync
  kind: nav
  description: "The projection into organization groups, and the sync from user attributes."
openapi: 3.2.0
components:
  schemas:
    Assignment:
      required:
      - employmentId
      - orgUnitId
      - validFrom
      description: A request to add an assignment gives the first details in the fields
        of the assignment itself. A response gives the details of every period in
        `periods`.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        employmentId:
          type: string
        userId:
          type: string
          description: The ID of the Keycloak user of the employment.
          readOnly: true
        orgUnitId:
          type: string
        validFrom:
          type: string
          description: The first date of the assignment.
          format: date
        validTo:
          type: string
          description: The first date after the assignment. It is missing for no end.
          format: date
        externalId:
          type: string
          description: The ID of the assignment in the system it came from.
        source:
          type: string
          description: The name of that system.
        jobTitle:
          type: string
          description: The code of the first job title.
          writeOnly: true
        occupation:
          type: string
          description: The code of the first occupation.
          writeOnly: true
        kind:
          type: string
          description: The code of the first assignment kind.
          writeOnly: true
        head:
          type: boolean
          description: Whether the person leads the org unit at first.
          writeOnly: true
        primary:
          type: boolean
          description: Whether this is the main assignment at first.
          writeOnly: true
        switchPrimary:
          type: boolean
          description: True to take the primary flag away from other assignments of
            the employment for the same dates.
          writeOnly: true
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The first share of the person's work in percent.
          writeOnly: true
        displayOrder:
          type: integer
          format: int32
          description: The first position among the members of the org unit.
          writeOnly: true
        attributes:
          type: object
          additionalProperties: {}
          description: The first free values.
          writeOnly: true
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentDetails"
          description: "The details of each period, oldest first."
          readOnly: true
    AssignmentDetails:
      type: object
      required:
      - validFrom
      description: The details of an assignment for a period.
      properties:
        validFrom:
          type: string
          description: The first date of these details.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
          readOnly: true
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        head:
          type: boolean
          description: True when the person leads the org unit.
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
        switchPrimary:
          type: boolean
          description: True to take the primary flag away from other assignments of
            the employment for the same dates.
          writeOnly: true
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: "The position among the members of the org unit, lowest first."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    ChangeLogEntry:
      required:
      - id
      - recordedAt
      - actorUserId
      - resourceType
      - resourceId
      - operation
      - resourcePath
      description: One successful write.
      type: object
      properties:
        id:
          type: string
        recordedAt:
          type: string
          description: "When the write happened, in UTC."
          format: date-time
        actorUserId:
          type: string
          description: The ID of the user who did the write.
        resourceType:
          type: string
          examples:
          - FUHITO_ORG_UNIT
        resourceId:
          type: string
        operation:
          type: string
          enum:
          - CREATE
          - UPDATE
          - DELETE
        resourcePath:
          type: string
          description: The path of the request below the realm.
          examples:
          - fuhito/org-units/123/end
        changeOrderId:
          type: string
          description: The ID of the change order that the write belongs to.
        representation:
          description: The state of the resource after the write. It is missing after
            a delete.
          type: object
          additionalProperties: true
    ChangeOrder:
      required:
      - title
      - effectiveDate
      type: object
      properties:
        id:
          type: string
          readOnly: true
        number:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the order.
        kind:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code for the kind of order that the realm chooses.
        title:
          type: string
          maxLength: 255
        note:
          type: string
          description: A longer text.
        orderDate:
          type: string
          description: The date when the order was issued.
          format: date
        effectiveDate:
          type: string
          description: The date from which the changes are true.
          format: date
        approverUserId:
          type: string
          description: The ID of the Keycloak user who approved the order.
        requesterUserId:
          type: string
          description: The ID of the Keycloak user who asked for the order.
        externalReference:
          type: string
          description: A reference to the order in another system.
        createdAt:
          type: string
          description: "When the order was stored, in UTC."
          format: date-time
          readOnly: true
    Employment:
      required:
      - validFrom
      description: A request to start an employment gives the first terms in the fields
        of the employment itself. It names the person by `personId` or by `userId`.
        A response gives the terms of every period in `terms`.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        personId:
          type: string
          description: The ID of the person.
        userId:
          type: string
          description: "The ID of the Keycloak user that the person is linked to.\
            \ A request can give it in place of `personId`. The person of the user\
            \ is then used, and created when the user has none."
        validFrom:
          type: string
          description: The first date of the employment.
          format: date
        validTo:
          type: string
          description: The first date after the employment. It is missing for no end.
          format: date
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person.
        endReason:
          type: string
          description: The code of the end reason.
          readOnly: true
        externalId:
          type: string
          description: The ID of the employment in the system it came from.
        source:
          type: string
          description: The name of that system.
        employmentType:
          type: string
          description: The code of the first employment type.
          writeOnly: true
        grade:
          type: string
          description: The code of the first grade.
          writeOnly: true
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          description: The first status.
          writeOnly: true
          default: ACTIVE
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The first share of full-time work in percent.
          writeOnly: true
        attributes:
          type: object
          additionalProperties: {}
          description: The first free values.
          writeOnly: true
        terms:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentTerms"
          description: "The terms of each period, oldest first."
          readOnly: true
    EmploymentStatus:
      type: string
      enum:
      - ACTIVE
      - ON_LEAVE
      - SUSPENDED
      description: Whether a person works during a period of an employment.
    EmploymentTerms:
      type: object
      required:
      - validFrom
      description: The conditions of an employment for a period.
      properties:
        validFrom:
          type: string
          description: The first date of these conditions.
          format: date
        validTo:
          type: string
          description: The first date after these conditions. It is missing for no
            end.
          format: date
          readOnly: true
        employmentType:
          type: string
          description: The code of the employment type.
        grade:
          type: string
          description: The code of the grade.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          default: ACTIVE
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    End:
      required:
      - validTo
      description: A request to end something on a date.
      type: object
      properties:
        validTo:
          type: string
          description: The first date on which it no longer exists.
          format: date
        endReason:
          type: string
          description: The code of the end reason. Only the end of an employment uses
            it.
    Error:
      required:
      - error
      - message
      type: object
      properties:
        error:
          type: string
          description: The stable error code.
        params:
          type: object
          additionalProperties:
            type: string
          description: The values that the message refers to.
        message:
          type: string
          description: The message for people. Its text can change. Its language follows
            the `Accept-Language` header.
    Export:
      required:
      - exportedAt
      - refItems
      - orgUnits
      - employments
      - assignments
      - changeOrders
      description: "All organization data of one realm, with every period of every\
        \ resource."
      type: object
      properties:
        exportedAt:
          type: string
          description: "When the export was made, in UTC."
          format: date-time
        refItems:
          type: array
          items:
            $ref: "#/components/schemas/RefItem"
          description: "The reference items of every kind, inactive ones included."
        orgUnits:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnitHistory"
          description: The org units with every period of their details and their
            parents.
        employments:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
          description: The employments with every period of their terms.
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
          description: The assignments with every period of their details.
        changeOrders:
          type: array
          items:
            $ref: "#/components/schemas/ChangeOrder"
    Hierarchy:
      required:
      - id
      - code
      - name
      description: A named tree of org units.
      type: object
      properties:
        id:
          type: string
        code:
          type: string
          description: The code
        name:
          type: string
    ImportAssignmentRow:
      type: object
      required:
      - externalId
      - employmentExternalId
      - orgUnitExternalId
      description: An assignment. It is matched by source and external ID.
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the assignment in that system.
        employmentExternalId:
          type: string
          description: The external ID of the employment with the same source.
        orgUnitExternalId:
          type: string
          description: The external ID of the org unit with the same source.
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        head:
          type: boolean
          description: True when the person leads the org unit.
          default: false
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
          default: false
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: The position among the members of the org unit.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        validFrom:
          type: string
          description: The first date of a new assignment. The default is the effective
            date. An existing assignment ignores it.
          format: date
        validTo:
          type: string
          description: The first date on which the assignment no longer holds. The
            default is the end of the employment.
          format: date
    ImportCounts:
      type: object
      required:
      - created
      - changed
      - unchanged
      description: The number of rows of one list by outcome.
      properties:
        created:
          type: integer
          format: int32
          description: Rows that made a new thing.
        changed:
          type: integer
          format: int32
          description: Rows that changed an existing thing.
        unchanged:
          type: integer
          format: int32
          description: Rows that matched what was stored.
    ImportDocument:
      required:
      - effectiveDate
      description: "The data of one import. The document describes the state from\
        \ the effective date. A new thing starts on that date, and a change to an\
        \ existing thing takes effect on that date."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date of the state.
          format: date
        dryRun:
          type: boolean
          description: True to do all checks and write nothing.
          default: false
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the rows come from. Rows can override
            it.
          default: import
        refItems:
          type: array
          items:
            $ref: "#/components/schemas/ImportRefItemRow"
        orgUnits:
          type: array
          items:
            $ref: "#/components/schemas/ImportOrgUnitRow"
        employments:
          type: array
          items:
            $ref: "#/components/schemas/ImportEmploymentRow"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/ImportAssignmentRow"
    ImportEmploymentRow:
      type: object
      required:
      - externalId
      description: An employment. It is matched by source and external ID.
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the employment in that system.
        username:
          type: string
          description: The username of the Keycloak user. Either this or `userId`
            is required.
        userId:
          type: string
          description: The ID of the Keycloak user.
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person. It is
            used only when the employment is created.
        employmentType:
          type: string
          description: The code of the employment type.
        grade:
          type: string
          description: The code of the grade.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
          default: ACTIVE
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
        attributes:
          type: object
          additionalProperties: {}
          description: Free values of the terms.
        validFrom:
          type: string
          description: The first date of a new employment. The default is the effective
            date. An existing employment ignores it.
          format: date
        validTo:
          type: string
          description: The first date on which the employment no longer holds.
          format: date
        endReason:
          type: string
          description: The code of the end reason. It is used only with `validTo`.
    ImportOrgUnitRow:
      type: object
      required:
      - externalId
      - name
      description: An org unit. It is matched by source and external ID.
      properties:
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of the system that the row comes from. The default
            is the source of the document.
        externalId:
          type: string
          description: The ID of the unit in that system.
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that is unique in the realm. It is used only when the
            unit is created.
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        shortName:
          type: string
          maxLength: 255
          description: The default short name.
        shortNames:
          type: object
          additionalProperties:
            type: string
          description: "The short names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        unitType:
          type: string
          description: The code of the unit type.
        parentExternalId:
          type: string
          description: The external ID of the parent with the same source. A root
            has none.
        displayOrder:
          type: integer
          format: int32
          description: The position among siblings.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        validFrom:
          type: string
          description: The first date of a new unit. The default is the effective
            date. An existing unit ignores it.
          format: date
        validTo:
          type: string
          description: The first date on which the unit no longer exists.
          format: date
    ImportRefItemRow:
      type: object
      required:
      - kind
      - code
      - name
      description: A reference item. It is matched by kind and code.
      properties:
        kind:
          $ref: "#/components/schemas/RefKind"
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        displayOrder:
          type: integer
          format: int32
          description: The position in lists.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        active:
          type: boolean
          description: False to stop the use of the item for new data.
          default: true
    ImportReport:
      required:
      - dryRun
      - applied
      - counts
      - errors
      description: "What an import did, or would do."
      type: object
      properties:
        dryRun:
          type: boolean
          description: True when the request asked for a dry run.
        applied:
          type: boolean
          description: True when the rows were written. It is false for a dry run
            and when a row failed.
        counts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ImportCounts"
          description: The number of rows by outcome for each list of the document.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowError"
          description: "The rows that could not be applied. When this is not empty,\
            \ nothing was written."
    ImportRowError:
      type: object
      required:
      - list
      - row
      - error
      - message
      description: A row that could not be applied.
      properties:
        list:
          type: string
          description: The name of the list in the document.
        row:
          type: integer
          format: int32
          description: "The position of the row in its list, counted from 0."
        line:
          type: integer
          format: int32
          description: "The line number in the CSV file, counted from 1. Only a CSV\
            \ import has it."
        error:
          type: string
          description: The stable error code.
        params:
          type: object
          additionalProperties:
            type: string
          description: The values that the message refers to.
        message:
          type: string
          description: The message for people.
    Mask:
      required:
      - userId
      - maskedAt
      description: The result of a masking.
      type: object
      properties:
        userId:
          type: string
        maskedAt:
          type: string
          description: "When the data was first masked, in UTC."
          format: date-time
    Member:
      required:
      - assignmentId
      - employmentId
      - personId
      - orgUnitId
      - orgUnitName
      - validFrom
      - head
      - primary
      - displayOrder
      - status
      description: One assignment of one person on one date.
      type: object
      properties:
        assignmentId:
          type: string
        employmentId:
          type: string
        personId:
          type: string
          description: The ID of the person.
        userId:
          type: string
          description: The ID of the Keycloak user that the person is linked to.
        staffNumber:
          type: string
          description: The number that the legal entity gives to the person.
        orgUnitId:
          type: string
        orgUnitName:
          type: string
          description: The name of the org unit on the date.
        orgUnitPath:
          type: array
          items:
            $ref: "#/components/schemas/PathEntry"
          description: The units from the root down to the org unit. Only present
            when asked for.
        validFrom:
          type: string
          description: The first date of these details of the assignment.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
        jobTitle:
          type: string
          description: The code of the job title.
        occupation:
          type: string
          description: The code of the occupation.
        kind:
          type: string
          description: The code of the assignment kind.
        head:
          type: boolean
          description: True when the person leads the org unit.
        primary:
          type: boolean
          description: True when this is the main assignment of the employment.
        allocationPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of the person's work in percent.
        displayOrder:
          type: integer
          format: int32
          description: "The position among the members of the org unit, lowest first."
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        employmentType:
          type: string
          description: The code of the employment type on the date.
        grade:
          type: string
          description: The code of the grade on the date.
        status:
          $ref: "#/components/schemas/EmploymentStatus"
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work on the date in percent.
    OrgUnit:
      type: object
      required:
      - name
      - validFrom
      description: An org unit as it is on one date.
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: A code that is unique in the realm.
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        shortName:
          type: string
          maxLength: 255
          description: The default short name.
        shortNames:
          type: object
          additionalProperties:
            type: string
          description: "The short names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        unitType:
          type: string
          description: The code of the unit type.
        parentId:
          type: string
          description: The ID of the parent in the default hierarchy. A root has none.
        validFrom:
          type: string
          description: The first date of these details.
          format: date
        validTo:
          type: string
          description: The first date after these details. It is missing for no end.
          format: date
          readOnly: true
        displayOrder:
          type: integer
          format: int32
          description: "The position among siblings, lowest first."
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          description: The ID of the unit in the system it came from.
        source:
          type: string
          description: The name of that system.
        keycloakOrganizationId:
          type: string
          description: The ID of the linked Keycloak organization.
          readOnly: true
        timeZone:
          type: string
          description: The time zone that the unit sets for itself and the units below
            it.
          readOnly: true
        dayStart:
          type: string
          description: The day start that the unit sets for itself and the units below
            it.
          readOnly: true
    OrgUnitHistory:
      type: object
      required:
      - id
      - versions
      - parents
      description: Everything that is stored about an org unit over time.
      properties:
        id:
          type: string
        code:
          type: string
        externalId:
          type: string
          description: The ID of the unit in the system it came from.
        source:
          type: string
          description: The name of that system.
        versions:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnit"
          description: "The details of each period, oldest first. They have no parent."
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ParentPeriod"
          description: "The parents in the default hierarchy, oldest first. A gap\
            \ means the unit was a root."
    OrganizationLink:
      description: The link of an org unit to a Keycloak organization.
      type: object
      properties:
        orgUnitId:
          type: string
          readOnly: true
        organizationId:
          type: string
          description: The ID of the Keycloak organization. A request to link needs
            it. A response has none after the link was removed.
    ParentChange:
      required:
      - validFrom
      type: object
      properties:
        parentId:
          type: string
          description: The ID of the new parent. Leave it out to make the unit a root.
        validFrom:
          type: string
          description: The first date under the new parent.
          format: date
    ParentPeriod:
      type: object
      required:
      - parentId
      - validFrom
      description: The parent of an org unit for a period.
      properties:
        parentId:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          description: The first date after the period. It is missing for no end.
          format: date
    PathEntry:
      type: object
      required:
      - id
      - name
      description: One org unit on the way from the root.
      properties:
        id:
          type: string
        name:
          type: string
          description: The name of the org unit on the date.
    Person:
      description: A person that the realm knows. A person does not need a Keycloak
        user.
      type: object
      properties:
        id:
          type: string
          readOnly: true
        userId:
          type: string
          description: The ID of the linked Keycloak user. One user is linked to at
            most one person.
        name:
          type: string
          maxLength: 255
          description: "The default name. A person with no linked user needs it. When\
            \ the record has no name, a response has the name of the linked user from\
            \ Keycloak."
        nameSource:
          type: string
          description: Where the name of a response came from. `RECORD` is the person
            record. `KEYCLOAK` is the linked user. It is missing when there is no
            name.
          readOnly: true
          enum:
          - RECORD
          - KEYCLOAK
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          description: The ID of the person in the system it came from. Only a create
            request reads it.
        source:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The name of that system. Only a create request reads it.
    ProjectionReport:
      required:
      - organizations
      - groupsCreated
      - groupsRenamed
      - groupsMoved
      - groupsRemoved
      - membersJoined
      - membersLeft
      - organizationMembersAdded
      description: What a rebuild of the projection changed in Keycloak.
      type: object
      properties:
        organizations:
          type: integer
          format: int32
          description: The number of linked organizations that were projected.
        groupsCreated:
          type: integer
          format: int32
          description: The number of groups that were created.
        groupsRenamed:
          type: integer
          format: int32
          description: The number of groups that got a new name.
        groupsMoved:
          type: integer
          format: int32
          description: The number of groups that got a new parent.
        groupsRemoved:
          type: integer
          format: int32
          description: The number of groups that were removed.
        membersJoined:
          type: integer
          format: int32
          description: The number of group memberships that were added.
        membersLeft:
          type: integer
          format: int32
          description: The number of group memberships that were removed.
        organizationMembersAdded:
          type: integer
          format: int32
          description: The number of users who became members of an organization.
    Qualification:
      required:
      - kind
      - validFrom
      type: object
      properties:
        id:
          type: string
          readOnly: true
        personId:
          type: string
          description: The ID of the person. Only a request to add reads it.
        userId:
          type: string
          description: "The ID of the Keycloak user that the person is linked to.\
            \ A request to add can give it in place of `personId`. The person of the\
            \ user is then used, and created when the user has none."
        kind:
          type: string
          description: The code of the qualification kind.
        number:
          type: string
          maxLength: 255
          description: The number of the license or certificate.
        validFrom:
          type: string
          description: The first date on which the qualification is valid.
          format: date
        validTo:
          type: string
          description: The first date on which it is no longer valid. It is missing
            for no end.
          format: date
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        externalId:
          type: string
          description: The ID of the qualification in the system it came from.
        source:
          type: string
          description: The name of that system.
    RefItem:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          readOnly: true
        kind:
          $ref: "#/components/schemas/RefKind"
          description: Only a create request reads it.
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: Only a create request reads it.
        name:
          type: string
          maxLength: 255
          description: The default name.
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        displayOrder:
          type: integer
          format: int32
          description: "The position in lists, lowest first."
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
        active:
          type: boolean
          description: False when the item must not be used for new data.
    RefKind:
      type: string
      enum:
      - UNIT_TYPE
      - JOB_TITLE
      - OCCUPATION
      - EMPLOYMENT_TYPE
      - GRADE
      - END_REASON
      - ASSIGNMENT_KIND
      - QUALIFICATION
      description: The kinds of reference items. Each realm defines its own items
        for each kind.
    Reorganization:
      required:
      - effectiveDate
      - steps
      description: "A request to change many org units on one date, and its response."
      type: object
      properties:
        effectiveDate:
          type: string
          description: The date of every step.
          format: date
          writeOnly: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReorganizationStep"
          description: "The steps, in the order to apply them."
          writeOnly: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReorganizationResult"
          description: "What each step did, in the same order."
          readOnly: true
    ReorganizationResult:
      type: object
      required:
      - op
      - unit
      description: What one step did.
      properties:
        op:
          type: string
          enum:
          - create
          - change
          - move
          - end
        unit:
          description: "The unit after the step. For an end, it is the unit on its\
            \ last date."
          type: object
          $ref: "#/components/schemas/OrgUnit"
    ReorganizationStep:
      type: object
      required:
      - op
      description: One operation of a reorganization.
      properties:
        op:
          type: string
          enum:
          - create
          - change
          - move
          - end
        ref:
          type: string
          description: A name that later steps of the same request can use for the
            unit that a create step makes.
        id:
          type: string
          description: "The ID of the unit to change, move, or end."
        unitRef:
          type: string
          description: "The `ref` of an earlier create step, in place of `id`."
        parentId:
          type: string
          description: The ID of the parent for a create or a move.
        parentRef:
          type: string
          description: "The `ref` of an earlier create step, in place of `parentId`."
        code:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The code of a new unit.
        name:
          type: string
          maxLength: 255
          description: "The default name, for a create or a change."
        names:
          type: object
          additionalProperties:
            type: string
          description: "Names in other languages, by language tag."
        shortName:
          type: string
          maxLength: 255
          description: The default short name.
        shortNames:
          type: object
          additionalProperties:
            type: string
          description: "The short names in other languages, by language tag."
        phoneticName:
          type: string
          maxLength: 255
          description: The reading of the name for sorting.
        unitType:
          type: string
          description: The code of the unit type.
        displayOrder:
          type: integer
          format: int32
          description: The position among siblings.
          default: 0
        attributes:
          type: object
          additionalProperties: {}
          description: Free values that the realm defines.
    Reporting:
      required:
      - personId
      - kind
      - derived
      - assignmentId
      - orgUnitId
      description: "One manager of a person, or one direct report of a person, on\
        \ a date."
      type: object
      properties:
        personId:
          type: string
          description: "The ID of the other person. It is the manager in a list of\
            \ managers, and the report in a list of reports."
        userId:
          type: string
          description: The ID of the Keycloak user that the other person is linked
            to.
        kind:
          $ref: "#/components/schemas/ReportingKind"
        derived:
          type: boolean
          description: True when no reporting line is stored and the head of the org
            unit is taken as the manager.
        lineId:
          type: string
          description: The ID of the stored reporting line. A derived entry has none.
        assignmentId:
          type: string
          description: The ID of the assignment of the person who reports.
        orgUnitId:
          type: string
          description: The ID of the org unit of that assignment.
    ReportingKind:
      type: string
      enum:
      - SOLID
      - DOTTED
      description: |
        `SOLID` is the main manager. An assignment has at most one at a time.
        `DOTTED` is a further manager, for example of a project.
    ReportingLine:
      required:
      - assignmentId
      - validFrom
      type: object
      properties:
        id:
          type: string
          readOnly: true
        assignmentId:
          type: string
          description: The ID of the assignment of the person who reports.
        managerPersonId:
          type: string
          description: The ID of the person who is the manager.
        managerUserId:
          type: string
          description: "The ID of the Keycloak user that the manager is linked to.\
            \ A request can give it in place of `managerPersonId`. The person of the\
            \ user is then used, and created when the user has none."
        kind:
          $ref: "#/components/schemas/ReportingKind"
          default: SOLID
        validFrom:
          type: string
          description: The first date of the line.
          format: date
        validTo:
          type: string
          description: The first date after the line. Leave it out to last as long
            as the assignment.
          format: date
    Staff:
      required:
      - orgUnitId
      - validFrom
      description: "A request to add a person to an org unit in one call, and its\
        \ response. The request starts an employment and adds its first assignment."
      type: object
      properties:
        personId:
          type: string
          description: The ID of the person.
          writeOnly: true
        userId:
          type: string
          description: "The ID of the Keycloak user, in place of `personId`. The person\
            \ of the user is used, and created when the user has none."
          writeOnly: true
        orgUnitId:
          type: string
          writeOnly: true
        validFrom:
          type: string
          description: The first date of the employment and of the assignment.
          format: date
          writeOnly: true
        validTo:
          type: string
          description: The first date after both.
          format: date
          writeOnly: true
        staffNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
          description: The number that the legal entity gives to the person.
          writeOnly: true
        employmentType:
          type: string
          description: The code of the employment type.
          writeOnly: true
        grade:
          type: string
          description: The code of the grade.
          writeOnly: true
        workPercent:
          type: number
          maximum: 100
          exclusiveMinimum: 0
          description: The share of full-time work in percent.
          writeOnly: true
        jobTitle:
          type: string
          description: The code of the job title.
          writeOnly: true
        occupation:
          type: string
          description: The code of the occupation.
          writeOnly: true
        head:
          type: boolean
          description: True when the person leads the org unit.
          writeOnly: true
          default: false
        primary:
          type: boolean
          description: False when this is not the main assignment.
          writeOnly: true
          default: true
        employment:
          readOnly: true
          type: object
          $ref: "#/components/schemas/Employment"
        assignment:
          readOnly: true
          type: object
          $ref: "#/components/schemas/Assignment"
    SyncReport:
      required:
      - dryRun
      - users
      - employmentsStarted
      - assignmentsAdded
      - assignmentsMoved
      - assignmentsChanged
      - assignmentsEnded
      - reportingLinesChanged
      - unmatched
      description: "What a sync from user attributes did, or would do."
      type: object
      properties:
        dryRun:
          type: boolean
          description: True when the request asked for a dry run.
        users:
          type: integer
          format: int32
          description: The number of users with a department.
        employmentsStarted:
          type: integer
          format: int32
          description: The number of employments that were started.
        assignmentsAdded:
          type: integer
          format: int32
          description: The number of assignments that were added.
        assignmentsMoved:
          type: integer
          format: int32
          description: The number of users whose assignment moved to another org unit.
        assignmentsChanged:
          type: integer
          format: int32
          description: The number of assignments that got a new job title.
        assignmentsEnded:
          type: integer
          format: int32
          description: The number of assignments that ended because the department
            was removed.
        reportingLinesChanged:
          type: integer
          format: int32
          description: The number of users whose reporting line changed.
        unmatched:
          type: array
          items:
            $ref: "#/components/schemas/SyncUnmatched"
          description: The values of user attributes that matched nothing.
    SyncUnmatched:
      type: object
      required:
      - userId
      - field
      - value
      - reason
      description: A value of a user attribute that matched nothing.
      properties:
        userId:
          type: string
        field:
          type: string
          enum:
          - department
          - title
          - manager
        value:
          type: string
        reason:
          type: string
          description: '`unknown` when nothing has the value. `ambiguous` when more
            than one org unit has the name.'
          enum:
          - unknown
          - ambiguous
    TimeSettings:
      description: "The time settings of an org unit. They also hold for the units\
        \ below it, unless one of them has its own."
      type: object
      properties:
        orgUnitId:
          type: string
          readOnly: true
        timeZone:
          type: string
          description: The time zone. Leave it out to use the one from above.
          examples:
          - America/New_York
        dayStart:
          type: string
          description: "The time of day when the date changes, as `HH:mm`. Leave it\
            \ out to use the one from above."
          examples:
          - 05:00
    UserHistory:
      required:
      - userId
      - employments
      - assignments
      description: Everything that is stored about one user over time.
      type: object
      properties:
        userId:
          type: string
        maskedAt:
          type: string
          description: "When the personal data of the user was masked, in UTC. It\
            \ is missing when it never was."
          format: date-time
        employments:
          type: array
          items:
            $ref: "#/components/schemas/Employment"
          description: "The employments with their terms, oldest first."
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
          description: "The assignments with their details, oldest first."
    Version:
      required:
      - version
      type: object
      properties:
        version:
          type: string
  parameters:
    changeOrder:
      description: |
        The ID of the change order that the write belongs to.
        A request that names an unknown change order gets 400 and writes nothing.
      in: query
      name: changeOrder
      schema:
        type: string
  responses:
    BadRequest:
      description: A value in the request is bad.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The request conflicts with existing data.
        A realm with no usable time zone also gets this status on every request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the permission.
    ImportFailed:
      description: |
        A row failed, and the body is the report with every bad row.
        Or the request itself is bad, and the body is an error.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: "#/components/schemas/ImportReport"
            - $ref: "#/components/schemas/Error"
    NotFound:
      description: The target does not exist in the realm.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request has no valid token.
  securitySchemes:
    bearer:
      type: http
      description: An access token for the admin API of Keycloak.
      scheme: bearer
      bearerFormat: JWT
info:
  description: |
    The API has no release yet and can still change.

    Dates have the form `YYYY-MM-DD`.
    A period includes its `validFrom` date and does not include its `validTo` date.

    A response leaves out every field that has no value.
    For example, an org unit with no end date has no `validTo` field.

    A read needs the permission to view users. A write needs the permission to manage users.

    A write belongs to a change order when its request has the query parameter `changeOrder`.

    A failed request writes nothing.
  license:
    identifier: Apache-2.0
    name: "Apache License, Version 2.0"
  summary: Organization structure and its history for each Keycloak realm.
  title: keycloak-fuhito admin REST API
  version: 0.1.0
servers:
- url: "{baseUrl}/admin/realms/{realm}/fuhito"
  variables:
    baseUrl:
      description: The base URL of Keycloak.
      default: http://localhost:8080
    realm:
      description: The name of the realm.
      default: master
security:
- bearer: []
externalDocs:
  description: How the extension plugs into Keycloak
  url: https://github.com/exoego/keycloak-fuhito/blob/main/docs/keycloak-integration.md
paths:
  /:
    get:
      summary: Returns the version of this extension.
      operationId: getVersion
      tags:
      - general
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments:
    post:
      summary: Adds an assignment of an employment to an org unit.
      operationId: addAssignment
      tags:
      - assignments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignment"
        required: true
      responses:
        "201":
          description: The new assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments/{id}:
    get:
      summary: Returns an assignment with the details of every period.
      operationId: getAssignment
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments/{id}/details:
    put:
      summary: Replaces the details of an assignment from the `validFrom` date of
        the body.
      description: The employment and the org unit do not change.
      operationId: changeAssignmentDetails
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentDetails"
        required: true
      responses:
        "200":
          description: The assignment with the details of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /assignments/{id}/end:
    delete:
      summary: Removes the end of an assignment.
      description: The assignment then lasts as long as its employment.
      operationId: removeAssignmentEnd
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "200":
          description: The assignment with the details of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      summary: Sets the end of an assignment.
      description: Its history stays readable. The end can move earlier or later.
      operationId: endAssignment
      tags:
      - assignments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/End"
        required: true
      responses:
        "200":
          description: The assignment with the details of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /attribute-sync/run:
    post:
      summary: Makes the assignments and reporting lines of the sync match the user
