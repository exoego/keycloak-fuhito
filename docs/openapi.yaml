        required: true
        schema:
          type: string
      - description: The date to read. The default is today in the time zone of the
          realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: True to return each org unit with its path from the root.
        schema:
          type: boolean
          default: false
        name: includePath
        in: query
      responses:
        "200":
          description: The assignments of the user on the date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/{userId}/data:
    delete:
      summary: Erases everything about one user for good.
      description: "These are the employments with their terms and assignments, the\
        \ qualifications, and the reporting lines of the user as a report and as a\
        \ manager. The change log keeps its entries about them, because they hold\
        \ only IDs. Removal of a user from Keycloak does not do this. This endpoint\
        \ is for a request to delete personal data."
      operationId: eraseUserData
      tags:
      - users
      parameters:
      - description: The ID of the Keycloak user.
        name: userId
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "204":
          description: The data was erased.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/{userId}/history:
    get:
      summary: "Returns every employment and every assignment of a user, with all\
        \ their periods."
      operationId: getUserHistory
      tags:
      - users
      parameters:
      - description: The ID of the Keycloak user.
        name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The history of the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserHistory"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/{userId}/managers:
    get:
      summary: "Lists the managers of a user on a date, for each assignment of the\
        \ user."
      description: "An assignment with no stored solid line takes the head of its\
        \ org unit, or of the nearest unit above."
      operationId: listUserManagers
      tags:
      - users
      parameters:
      - description: The ID of the Keycloak user.
        name: userId
        in: path
        required: true
        schema:
          type: string
      - description: The date to read. The default is today in the time zone of the
          realm.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      responses:
        "200":
          description: The managers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reporting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/{userId}/mask:
    post:
      summary: Masks the personal data of a user who left. It cannot be undone.
      description: "It clears the staff number, the numbers of qualifications, the\
        \ external IDs, and the free attributes. Every record keeps its ID, its org\
        \ unit, its job title, its occupation, and its dates. The entries of the change\
        \ log stay as they are."
      operationId: maskUser
      tags:
      - users
      parameters:
      - description: The ID of the Keycloak user.
        name: userId
        in: path
        required: true
        schema:
          type: string
      - description: "True to also empty the first and the last name of the linked\
          \ Keycloak user. It also needs the permission of Keycloak to manage that\
          \ user. The username, the email, and the attributes stay. False leaves the\
          \ Keycloak user as it is, so responses still show its name. A read-only\
          \ user, for example from a user store, cannot be changed. The masking then\
          \ fails with 409 and `person.keycloak_name_read_only`, and nothing is written."
        schema:
          type: boolean
          default: false
        name: clearKeycloakName
        in: query
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "200":
          description: The person and the time of the masking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /users/{userId}/qualifications:
    get:
      summary: "Lists the qualifications of a user, oldest first."
      operationId: listUserQualifications
      tags:
      - users
      parameters:
      - description: The ID of the Keycloak user.
        name: userId
        in: path
        required: true
        schema:
          type: string
      - description: "True to return every qualification, expired ones and future\
          \ ones included."
        schema:
          type: boolean
          default: false
        name: all
