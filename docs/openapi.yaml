                items:
                  $ref: "#/components/schemas/ChangeLogEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /change-orders/{id}/changes/count:
    get:
      summary: "Counts the writes that `GET /change-orders/{id}/changes` lists."
      operationId: countChangeOrderChanges
      tags:
      - change-orders
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The number of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /effective-changes:
    get:
      summary: Lists the resources with a period that starts or ends in a range of
        dates.
      description: "A change with a future date is in the change log on the day it\
        \ is stored. This read tells when it takes effect. An entry says that something\
        \ about the resource starts, changes, or ends on the date. Read the resource\
        \ with `asOf` to see what. The entries come from the rows as they are now,\
        \ so a change that was removed before its date is not listed. The order is\
        \ the date, then the type, then the ID."
      operationId: listEffectiveChanges
      tags:
      - change-orders
      parameters:
      - description: The number of entries to skip.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The first date of the range. The default is today in the time
          zone of the realm.
        schema:
          type: string
          format: date
        name: from
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: The first date after the range. The default is the day after
          `from`.
        schema:
          type: string
          format: date
        name: to
        in: query
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EffectiveChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /effective-changes/count:
    get:
      summary: Counts the entries that `GET /effective-changes` lists with the same
        range.
      operationId: countEffectiveChanges
      tags:
      - change-orders
      parameters:
      - description: The first date of the range. The default is today in the time
          zone of the realm.
        schema:
          type: string
          format: date
        name: from
        in: query
      - description: The first date after the range. The default is the day after
          `from`.
        schema:
          type: string
          format: date
        name: to
        in: query
      responses:
        "200":
          description: The number of entries on all pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments:
    post:
      summary: Starts an employment of a user.
      operationId: startEmployment
      tags:
      - employments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Employment"
        required: true
      responses:
        "201":
          description: The new employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      summary: "Lists the employments of the realm, ordered by ID, each with all its\
        \ terms."
      description: "To read every employment, follow the `Link` header of each response."
      operationId: listEmployments
      tags:
      - employments
      parameters:
      - description: The cursor from the `Link` header of the page before.
        name: after
        in: query
        schema:
          type: string
      - description: A date to keep the employments that hold on it. Leave it out
          for every date.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: "The earliest contract end to keep. It is the `contractEndDate`\
          \ of the terms on `asOf`, or on today in the time zone of the realm when\
          \ `asOf` is left out."
        schema:
          type: string
          format: date
        name: contractEndFrom
        in: query
      - description: The first date after the latest contract end to keep.
        schema:
          type: string
          format: date
        name: contractEndTo
        in: query
      - description: "The ID of the org unit that employs, to keep."
        name: employerId
        in: query
        schema:
          type: string
      - description: The number of entries to skip. It cannot be used with `after`.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: A staff number to keep.
        name: staffNumber
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The employments.
          headers:
            Link:
              description: "The URL of the next page, with `rel=\"next\"`. It is there\
                \ when the page is full. A full page can be the last one, and the\
                \ next page is then empty."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/count:
    get:
      summary: Counts the employments that `GET /employments` lists with the same
        filters.
      operationId: countEmployments
      tags:
      - employments
      parameters:
      - description: A date to keep the employments that hold on it. Leave it out
          for every date.
        schema:
          type: string
          format: date
        name: asOf
        in: query
      - description: "The earliest contract end to keep. It is the `contractEndDate`\
          \ of the terms on `asOf`, or on today in the time zone of the realm when\
          \ `asOf` is left out."
        schema:
          type: string
          format: date
        name: contractEndFrom
        in: query
      - description: The first date after the latest contract end to keep.
        schema:
          type: string
          format: date
        name: contractEndTo
        in: query
      - description: "The ID of the org unit that employs, to keep."
        name: employerId
        in: query
        schema:
          type: string
      - description: A staff number to keep.
        name: staffNumber
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The number of employments on all pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Count"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/transfers:
    post:
      summary: "Moves every person of one employer to another employer on a date,\
        \ in one write."
      description: "It is for a merger of two legal entities. Each employment that\
        \ holds on the day before and on the date is transferred, as `POST /employments/{id}/transfer`\
        \ does for one. With `endEmployer`, the old employer ends on the same date.\
        \ A failure writes nothing."
      operationId: transferEmployments
      tags:
      - employments
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Transfers"
        required: true
      responses:
        "201":
          description: The old and the new employment of each person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}:
    delete:
      summary: "Deletes an employment that nothing refers to, with all its history."
      description: "It works only when the employment has no assignment and no role\
        \ over an org unit, and no employment continues it. Its terms go with it.\
        \ End an employment that held for a while instead."
      operationId: deleteEmployment
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: The version of the employment that the caller read.
        required: true
        schema:
          format: int64
          type: integer
        name: version
        in: query
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "204":
          description: The resource is gone.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      summary: Returns an employment with the terms of every period.
      operationId: getEmployment
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}/end:
    delete:
      summary: "Removes the end of an employment, for example to take back a resignation."
      description: "An employment that another one continues, as after a transfer,\
        \ keeps its end. The request then fails with 409 and `employment.continues_holds`."
      operationId: removeEmploymentEnd
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: The version of the employment that the caller read.
        required: true
        schema:
          format: int64
          type: integer
        name: version
        in: query
      - $ref: "#/components/parameters/changeOrder"
      responses:
        "200":
          description: The employment with the terms of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      summary: Sets the end of an employment.
      description: An earlier end is how a person leaves. It also ends the terms and
        the assignments on that date. A later end extends a fixed-term employment.
        A later end that comes after the start of an employment that continues this
        one fails with 409 and `employment.continues_holds`.
      operationId: endEmployment
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/End"
        required: true
      responses:
        "200":
          description: The employment with the terms of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}/leave:
    post:
      summary: Puts a person on leave from a date.
      description: "The status of the employment is `ON_LEAVE` from the date. Every\
        \ other value of the terms stays. With `validTo`, the status of before the\
        \ leave comes back on that date, in the same write. A change of terms that\
        \ is stored for a later date rejects the leave."
      operationId: startLeave
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Leave"
        required: true
      responses:
        "200":
          description: The employment with the terms of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}/promotion:
    post:
      summary: "Promotes a person on a date, in one write."
      description: "It sets the grade of the employment, and the job title or the\
        \ head flag of one assignment, from the date on. Every value that the request\
        \ does not name stays. The change lasts until the next change that is already\
        \ stored. A failure writes nothing."
      operationId: promote
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Promotion"
        required: true
      responses:
        "200":
          description: The employment and the assignment after the promotion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}/return:
    post:
      summary: Ends the leave of a person on a date.
      description: "The status of the employment is `ACTIVE` from the date. Every\
        \ other value of the terms stays. A return that was stored for a later date\
        \ stays too, and changes nothing more."
      operationId: endLeave
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Return"
        required: true
      responses:
        "200":
          description: The employment with the terms of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}/terms:
    put:
      summary: Replaces the terms of an employment from the `validFrom` date of the
        body.
      description: "The terms are the employment type, the grade, the status with\
        \ its leave reason, the work percentage, the end of a fixed-term contract,\
        \ and the attributes."
      operationId: changeEmploymentTerms
      tags:
      - employments
      parameters:
      - description: The ID of the resource.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmploymentTerms"
        required: true
      responses:
        "200":
          description: The employment with the terms of every period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /employments/{id}/transfer:
    post:
      summary: "Moves a person to another employer on a date, in one write."
      description: "The employment ends on the date. A new employment at the new employer\
        \ starts on the same date. It gets the terms, the assignments, the reporting\
        \ lines, and the roles over org units of the old one from the date on, also\
        \ the ones that were stored for a later date. It names the old employment\
        \ in `continuesEmploymentId`. An assignment, a line, or a role that starts\
        \ on the date or later goes away from the old employment, and its copy takes\
        \ its IDs of other systems. One that holds before the date only ends and keeps\
        \ its IDs. Its copy gets none. A failure writes nothing."
      operationId: transferEmployment
      tags:
      - employments
      parameters:
      - description: The ID of the employment at the old employer.
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Transfer"
        required: true
      responses:
        "201":
          description: "The two employments, and what the new one got."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /export/{list}:
    get:
      summary: "Reads one page of one list of every stored row of the realm, ordered\
        \ by ID."
      description: "Follow the `Link` header of each response to the end of the list.\
        \ Put the lists together under their names in camel case, with `format`, to\
        \ get the document that `POST /restore` takes. Rows name Keycloak users by\
        \ username."
      operationId: exportList
      tags:
      - bulk
      parameters:
      - description: The list.
        schema:
          type: string
