  /people:
    get:
      summary: "Lists the people of the realm, ordered by ID."
      description: "To read every person, follow the `Link` header of each response.\
        \ A late page then costs as much as the first one. With `first`, the database\
        \ counts past the skipped people."
      operationId: listPeople
      tags:
      - people
      parameters:
      - description: The cursor from the `Link` header of the page before. It is the
          name of its format and the values of the last row of that page.
        name: after
        in: query
        schema:
          type: string
      - description: The number of entries to skip. It cannot be used with `after`.
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
        name: first
        in: query
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      - description: "The ID of a Keycloak user, to return only the person that is\
          \ linked to it."
        name: userId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The people.
          headers:
            Link:
              description: "The URL of the next page, with `rel=\"next\"`. It is there\
                \ when the page is full. A full page can be the last one, and the\
                \ next page is then empty."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
