          - ref-items
          - attribute-definitions
          - hierarchies
          - org-units
          - people
          - employments
          - assignments
          - reporting-lines
          - unit-roles
          - qualifications
          - external-ids
          - change-orders
        name: list
        in: path
        required: true
      - description: The cursor from the `Link` header of the page before.
        name: after
        in: query
        schema:
          type: string
      - description: The largest number of entries to return.
        schema:
          type: integer
          format: int32
          maximum: 1000
          minimum: 0
          default: 100
        name: max
        in: query
      responses:
        "200":
          description: The rows of the page.
          content:
            application/json:
              schema: {}
          headers:
            Link:
              description: "The URL of the next page, with `rel=\"next\"`. It is there\
                \ when the page is full."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /external-ids:
    put:
      summary: "Stores the ID of one system for a resource, or replaces it."
      description: A resource has at most one ID for each system. One ID of one system
        names one resource of a kind. The ID of the system that made the resource
        can change here too. A request that replaces a stored ID needs the `version`
        of that ID that the caller read.
      operationId: putExternalId
      tags:
      - general
      parameters:
      - $ref: "#/components/parameters/changeOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalId"
        required: true
      responses:
        "200":
          description: The stored ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      summary: Lists every ID that systems have for one resource.
      description: "The ID of the system that made the resource comes first, then\
        \ the others by system. The IDs of an org unit, a reference item, a kind of\
        \ reference data, a hierarchy, and an attribute definition need the permission\
        \ to read the org structure. The others need the full read."
      operationId: listExternalIds
      tags:
      - general
      parameters:
      - description: The ID of the resource.
        required: true
        name: resourceId
        in: query
        schema:
          type: string
      - description: "The kind of resource, ORG_UNIT, PERSON, EMPLOYMENT, ASSIGNMENT,\
          \ QUALIFICATION, REPORTING_LINE, UNIT_ROLE, CHANGE_ORDER, REF_ITEM, REF_KIND,\
          \ HIERARCHY, or ATTRIBUTE_DEFINITION."
        required: true
        name: resourceType
        in: query
        schema:
          type: string
      responses:
        "200":
          description: The IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Removes the ID of one system from a resource.
      description: "The resource keeps the name of the system that made it in `source`,\
        \ also when this ID is the one of that system."
      operationId: deleteExternalId
      tags:
      - general
      parameters:
      - description: The ID of the resource.
        required: true
        name: resourceId
        in: query
        schema:
          type: string
      - description: "The kind of resource, ORG_UNIT, PERSON, EMPLOYMENT, ASSIGNMENT,\
          \ QUALIFICATION, REPORTING_LINE, UNIT_ROLE, CHANGE_ORDER, REF_ITEM, REF_KIND,\
          \ HIERARCHY, or ATTRIBUTE_DEFINITION."
        required: true
        name: resourceType
        in: query
        schema:
