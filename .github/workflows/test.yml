name: Test

permissions: {}

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }}${{ matrix.keycloak && format(', Keycloak {0}', matrix.keycloak) || '' }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          - 21
          - 25
        # Empty means the Keycloak version of the catalog. It keeps the row below from merging into the Java 21 row.
        keycloak:
          - ''
        # The oldest supported Keycloak. The provider runs in the JDK of the Keycloak image, so one test JDK is enough.
        include:
          - java: 21
            keycloak: 26.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle compiles with JDK 21 and runs the tests with the JDK of the matrix.
      # The last version becomes JAVA_HOME.
      - name: Set up JDKs
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            ${{ matrix.java }}
            21
          distribution: 'temurin'
          # Gradle files are cached by setup-gradle, so do not set "cache: gradle" here.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The integration tests start Keycloak and PostgreSQL with Testcontainers, using the Docker of the runner.
      - name: Run Tests
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
        run: ./gradlew check -PtestJavaVersion=${{ matrix.java }} -PtestKeycloakVersion="$KEYCLOAK_VERSION"

      # One row is enough. Every row measures the same unit tests.
      # A pull request from a fork has no token, and an upload that fails must not fail the tests.
      - name: Upload coverage to Codecov
        if: matrix.java == 21 && matrix.keycloak == ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          fail_ci_if_error: false

  # The one check of this workflow that branch protection requires. Its name does not change
  # when the matrix above changes. A new job of this workflow must be added to "needs".
  gate:
    name: Test gate
    timeout-minutes: 5
    # A skipped required job counts as passed, so run always and fail by hand.
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
