name: CI

permissions: {}

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          - 21
          - 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle compiles with JDK 21 and runs the tests with the JDK of the matrix.
      # The last version becomes JAVA_HOME.
      - name: Set up JDKs
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: |
            ${{ matrix.java }}
            21
          distribution: 'temurin'
          # Gradle files are cached by setup-gradle, so do not set "cache: gradle" here.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Tests
        run: ./gradlew check -PtestJavaVersion=${{ matrix.java }}

  # A skipped required job counts as passed, so fail instead of skipping.
  result:
    name: CI result
    timeout-minutes: 5
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check matrix result
        if: needs.test.result != 'success'
        run: exit 1
