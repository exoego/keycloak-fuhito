[versions]
keycloak = "26.8.2"
junit = "6.1.3"

[libraries]
keycloak-parent = { module = "org.keycloak:keycloak-parent", version.ref = "keycloak" }
# Keycloak loads these from its own lib directory, so the provider jar must not bundle them.
keycloak-core = { module = "org.keycloak:keycloak-core", version.ref = "keycloak" }
keycloak-common = { module = "org.keycloak:keycloak-common", version.ref = "keycloak" }
keycloak-server-spi = { module = "org.keycloak:keycloak-server-spi", version.ref = "keycloak" }
keycloak-server-spi-private = { module = "org.keycloak:keycloak-server-spi-private", version.ref = "keycloak" }
keycloak-services = { module = "org.keycloak:keycloak-services", version.ref = "keycloak" }
keycloak-model-jpa = { module = "org.keycloak:keycloak-model-jpa", version.ref = "keycloak" }
jboss-logging = { module = "org.jboss.logging:jboss-logging" }

# Not used directly. useJUnitJupiter takes only the version, and Renovate needs a library to find it.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version = "4.4.0" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version = "2.0.5" }
# The integration tests read the database directly. The version comes from the Keycloak parent POM.
postgresql = { module = "org.postgresql:postgresql" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.20" }

[bundles]
keycloak-provided = ["keycloak-core", "keycloak-common", "keycloak-server-spi", "keycloak-server-spi-private", "keycloak-services", "keycloak-model-jpa", "jboss-logging"]

[plugins]
nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version = "2.0.0" }
